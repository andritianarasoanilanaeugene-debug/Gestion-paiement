<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Consultation des paiements</title>

<style>

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #f8dbe5,
      transparent 35%
    ),
    #f8f1f4;

  color:#1e293b;

  min-height:100vh;

  padding:20px;

}

.container {

  max-width:1500px;

  margin:auto;

}

.header {

  background:
    linear-gradient(
      135deg,
      #5b0b20,
      #8f1d3e,
      #b8325a
    );

  color:white;

  padding:20px 25px;

  border-radius:18px;

  margin-bottom:18px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

}

.header h1 {

  font-size:24px;

}

.header p {

  font-size:13px;

  opacity:.85;

  margin-top:4px;

}

.btn {

  border:none;

  border-radius:10px;

  padding:11px 15px;

  cursor:pointer;

  font-weight:700;

}

.btn-back {

  background:
    rgba(255,255,255,.16);

  color:white;

}

.card {

  background:
    rgba(255,255,255,.96);

  padding:20px;

  border-radius:16px;

  border:
    1px solid #ead7df;

  box-shadow:
    0 5px 18px
    rgba(15,23,42,.07);

  margin-bottom:16px;

}

.source-selector {

  display:flex;

  gap:20px;

  flex-wrap:wrap;

  margin-bottom:18px;

}

.radio-option {

  display:flex;

  align-items:center;

  gap:7px;

  cursor:pointer;

  font-weight:700;

  color:#475569;

}

.filters {

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr auto;

  gap:13px;

  align-items:end;

}

.form-group {

  display:flex;

  flex-direction:column;

}

label {

  font-size:12px;

  font-weight:700;

  color:#475569;

  margin-bottom:6px;

}

input,
select {

  height:42px;

  border:
    1px solid #dbe2ea;

  border-radius:9px;

  background:#f8fafc;

  padding:0 12px;

  outline:none;

}

.btn-search {

  height:42px;

  background:#8f1d3e;

  color:white;

}

.table-wrapper {

  overflow:auto;

  border-radius:10px;

}

table {

  width:100%;

  border-collapse:collapse;

  min-width:1000px;

}

th {

  background:#651029;

  color:white;

  padding:11px 9px;

  font-size:11px;

  text-align:left;

  white-space:nowrap;

}

td {

  padding:9px;

  border-bottom:
    1px solid #edf0f3;

  font-size:11px;

  white-space:nowrap;

}

tr:nth-child(even) td {

  background:#fff8fa;

}

.amount {

  text-align:right;

  font-weight:700;

}

.loading,
.empty {

  display:none;

  text-align:center;

  padding:30px;

  color:#64748b;

}

.summary {

  display:flex;

  gap:12px;

  flex-wrap:wrap;

}

.summary-box {

  background:#fff1f5;

  border:
    1px solid #f1d3dd;

  border-radius:10px;

  padding:10px 14px;

}

.summary-label {

  font-size:11px;

  color:#64748b;

}

.summary-value {

  font-size:18px;

  font-weight:700;

  color:#7f1734;

}

@media(max-width:850px) {

  .filters {

    grid-template-columns:
      1fr 1fr;

  }

}

@media(max-width:600px) {

  body {

    padding:12px;

  }

  .header {

    flex-direction:column;

    align-items:flex-start;

  }

  .filters {

    grid-template-columns:1fr;

  }

  .btn-search {

    width:100%;

  }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

  <div>

    <h1>Consultation des paiements</h1>

    <p>
      Données locales ou Google Sheets
    </p>

  </div>


  <button
    class="btn btn-back"
    onclick="retourIndex()">

    ← Accueil

  </button>

</div>


<div class="card">

  <div class="source-selector">

    <label class="radio-option">

      <input
        type="radio"
        name="source"
        value="local"
        checked
        onchange="changerSource()">

      📱 Données locales

    </label>


    <label class="radio-option">

      <input
        type="radio"
        name="source"
        value="google"
        onchange="changerSource()">

      ☁️ Google Sheets

    </label>

  </div>


  <div class="filters">

    <div class="form-group">

      <label>Date début</label>

      <input
        type="date"
        id="dateDebut">

    </div>


    <div class="form-group">

      <label>Date fin</label>

      <input
        type="date"
        id="dateFin">

    </div>


    <div class="form-group">

      <label>Établissement</label>

      <select id="etablissement">

        <option value="">
          Tous les établissements
        </option>

        <option>LS1</option>
        <option>LS2</option>
        <option>LS3</option>

      </select>

    </div>


    <button
      class="btn btn-search"
      id="btnRecherche"
      onclick="rechercher()">

      🔎 Rechercher

    </button>

  </div>

</div>


<div
  class="card loading"
  id="loading">

  ⏳ Chargement...

</div>


<div
  class="card empty"
  id="empty">

  Aucun paiement trouvé.

</div>


<div
  class="card"
  id="tableContainer"
  style="display:none;">

  <div class="summary">

    <div class="summary-box">

      <div class="summary-label">
        Nombre de paiements
      </div>

      <div
        class="summary-value"
        id="nombreResultats">

        0

      </div>

    </div>


    <div class="summary-box">

      <div class="summary-label">
        Total
      </div>

      <div
        class="summary-value">

        <span id="totalPaiements">
          0
        </span>

        Ar

      </div>

    </div>

  </div>


  <br>


  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>Date</th>
          <th>Matricule</th>
          <th>Nom</th>
          <th>Classe</th>
          <th>Montant</th>
          <th>Établissement</th>
          <th>Motif</th>
          <th>ID Paiement</th>

        </tr>

      </thead>

      <tbody
        id="paymentsTable">
      </tbody>

    </table>

  </div>

</div>

</div>


<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzJBIds7jRI2DUTioirCcT23vHZQso4V8iqofmpU8fTbULaoNKlvHqcV0g-FIvgDHai/exec';


const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 3;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * SERVICE WORKER
 ************************************************************/

if (
  'serviceWorker' in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register(
          './service-worker.js'
        )
        .catch(
          console.warn
        );

    }
  );

}


/************************************************************
 * INDEXED DB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve,reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath:'id',
                autoIncrement:true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * RECHERCHE
 ************************************************************/

async function rechercher() {

  const dateDebut =
    document
      .getElementById(
        'dateDebut'
      )
      .value;


  const dateFin =
    document
      .getElementById(
        'dateFin'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  if (
    !dateDebut ||
    !dateFin
  ) {

    alert(
      'Veuillez sélectionner les deux dates.'
    );

    return;

  }


  if (
    dateDebut >
    dateFin
  ) {

    alert(
      'La date de début doit être antérieure ou égale à la date de fin.'
    );

    return;

  }


  afficherLoading();


  const source =
    document
      .querySelector(
        'input[name="source"]:checked'
      )
      .value;


  try {

    let paiements;


    if (
      source === 'local'
    ) {

      paiements =
        await rechercherLocal(
          dateDebut,
          dateFin,
          etablissement
        );

    } else {

      if (
        !navigator.onLine
      ) {

        throw new Error(
          'La consultation Google Sheets nécessite une connexion Internet.'
        );

      }


      paiements =
        await rechercherGoogle(
          dateDebut,
          dateFin,
          etablissement
        );

    }


    afficherResultats(
      paiements
    );


  } catch(erreur) {

    afficherErreur(
      erreur
    );

  }

}


/************************************************************
 * RECHERCHE GOOGLE
 ************************************************************/

async function rechercherGoogle(
  dateDebut,
  dateFin,
  etablissement
) {

  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {

        method:'POST',

        headers:{

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              'rechercherPaiements',

            dateDebut:
              dateDebut,

            dateFin:
              dateFin,

            etablissement:
              etablissement

          })

      }
    );


  const resultat =
    await response.json();


  if (
    !resultat.success
  ) {

    throw new Error(
      resultat.message
    );

  }


  return resultat.paiements;

}


/************************************************************
 * RECHERCHE LOCALE
 ************************************************************/

async function rechercherLocal(
  dateDebut,
  dateFin,
  etablissement
) {

  const db =
    await ouvrirDB();


  const elements =
    await new Promise(
      function(resolve,reject) {

        const transaction =
          db.transaction(
            STORE_PAIEMENTS,
            'readonly'
          );


        const request =
          transaction
            .objectStore(
              STORE_PAIEMENTS
            )
            .getAll();


        request.onsuccess =
          function() {

            resolve(
              request.result
            );

          };


        request.onerror =
          function() {

            reject(
              request.error
            );

          };

      }
    );


  const debut =
    new Date(
      dateDebut +
      'T00:00:00'
    );


  const fin =
    new Date(
      dateFin +
      'T23:59:59'
    );


  const resultat = [];


  elements.forEach(
    function(element) {

      const data =
        element.data;


      const date =
        new Date(
          element.dateCreation
        );


      if (
        etablissement &&
        data.etablissement !==
        etablissement
      ) {

        return;

      }


      if (
        date < debut ||
        date > fin
      ) {

        return;

      }


      const montant =
        calculerMontantLocal(
          data
        );


      resultat.push({

        date:
          formatDate(
            date
          ),

        matricule:
          calculerMatriculeLocal(
            data
          ),

        nom:
          data.nom,

        classe:
          data.classe,

        montant:
          montant,

        etablissement:
          data.etablissement,

        motif:
          construireMotifLocal(
            data
          ),

        idPaiement:
          data.idPaiement

      });

    }
  );


  resultat.reverse();


  return resultat;

}


/************************************************************
 * CALCUL LOCAL
 ************************************************************/

function valeur(v) {

  return Number(v || 0) || 0;

}


function calculerMontantLocal(
  data
) {

  let total = 0;


  [
    'droit',
    'fraisGeneraux',
    'fram',
    'teeShirt',
    'cravate',
    'short',
    'extra'

  ].forEach(
    function(id) {

      total +=
        valeur(
          data[id]
        );

    }
  );


  if (
    data.ecolage === true
  ) {

    total +=

      valeur(
        data.montantEcolage
      )

      *

      valeur(
        data.nombreMois
      );

  }


  return total;

}


function construireMotifLocal(
  data
) {

  const motifs = [];


  const mapping = [

    ['droit','Droit'],
    ['fraisGeneraux','Frais généraux'],
    ['fram','FRAM'],
    ['teeShirt','Tee-shirt'],
    ['cravate','Cravate'],
    ['short','Short'],
    ['extra','Extra']

  ];


  mapping.forEach(
    function(item) {

      if (
        valeur(
          data[item[0]]
        ) > 0
      ) {

        motifs.push(
          item[1]
        );

      }

    }
  );


  if (
    data.ecolage === true
  ) {

    motifs.push(
      'Écolage ' +
      valeur(
        data.nombreMois
      ) +
      ' mois'
    );

  }


  return motifs.join(
    ' + '
  );

}


function calculerMatriculeLocal(
  data
) {

  const codes = {

    'PS':'PS',
    'MS':'MS',
    '12ème':'12',
    '11ème':'11',
    '10ème':'10',
    '9ème':'9',
    '8ème':'8',
    '7ème':'7',
    '6ème':'6',
    '5ème':'5',
    '4ème':'4',
    '3ème':'3',
    '2nde':'2',
    '1ère':'1',
    'Terminale':'Tle'

  };


  return (

    String(data.nom || '')
      .trim()
      .replace(/\s+/g,' ')
      .toUpperCase()

    +

    '-' +

    codes[data.classe]

    +

    '-' +

    String(
      data.etablissement || ''
    )
      .trim()
      .toUpperCase()

  );

}


/************************************************************
 * FORMAT DATE
 ************************************************************/

function formatDate(
  date
) {

  const jour =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );


  const mois =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const annee =
    date.getFullYear();


  const heures =
    String(
      date.getHours()
    ).padStart(
      2,
      '0'
    );


  const minutes =
    String(
      date.getMinutes()
    ).padStart(
      2,
      '0'
    );


  return (

    jour +
    '/' +
    mois +
    '/' +
    annee +
    ' ' +
    heures +
    ':' +
    minutes

  );

}


/************************************************************
 * AFFICHAGE
 ************************************************************/

function afficherLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'empty'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';

}


function afficherResultats(
  paiements
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  const tbody =
    document.getElementById(
      'paymentsTable'
    );


  tbody.innerHTML =
    '';


  if (
    !paiements ||
    paiements.length === 0
  ) {

    document
      .getElementById(
        'empty'
      )
      .style.display =
      'block';


    document
      .getElementById(
        'nombreResultats'
      )
      .textContent =
      '0';


    document
      .getElementById(
        'totalPaiements'
      )
      .textContent =
      '0';


    return;

  }


  document
    .getElementById(
      'empty'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'block';


  let total = 0;


  paiements.forEach(
    function(paiement) {

      const montant =
        Number(
          paiement.montant
        ) || 0;


      total +=
        montant;


      const tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML = `

        <td>
          ${echapperHTML(
            paiement.date
          )}
        </td>

        <td>
          <strong>
            ${echapperHTML(
              paiement.matricule
            )}
          </strong>
        </td>

        <td>
          <strong>
            ${echapperHTML(
              paiement.nom
            )}
          </strong>
        </td>

        <td>
          ${echapperHTML(
            paiement.classe
          )}
        </td>

        <td class="amount">
          ${montant.toLocaleString(
            'fr-FR'
          )} Ar
        </td>

        <td>
          ${echapperHTML(
            paiement.etablissement
          )}
        </td>

        <td>
          ${echapperHTML(
            paiement.motif
          )}
        </td>

        <td>
          ${echapperHTML(
            paiement.idPaiement
          )}
        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );


  document
    .getElementById(
      'nombreResultats'
    )
    .textContent =
    paiements.length;


  document
    .getElementById(
      'totalPaiements'
    )
    .textContent =
    total.toLocaleString(
      'fr-FR'
    );

}


/************************************************************
 * ERREUR
 ************************************************************/

function afficherErreur(
  erreur
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  alert(
    erreur.message ||
    erreur
  );

}


/************************************************************
 * SOURCE
 ************************************************************/

function changerSource() {

  /*
   * Pas de requête automatique.
   *
   * On attend que l'utilisateur
   * clique sur Rechercher.
   */

}


/************************************************************
 * DATES
 ************************************************************/

function dateAujourdhui() {

  const date =
    new Date();


  return (

    date.getFullYear() +

    '-' +

    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +

    '-' +

    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    )

  );

}


document
  .getElementById(
    'dateDebut'
  )
  .value =
  dateAujourdhui();


document
  .getElementById(
    'dateFin'
  )
  .value =
  dateAujourdhui();


/************************************************************
 * HTML
 ************************************************************/

function echapperHTML(
  valeur
) {

  return String(
    valeur ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/************************************************************
 * RETOUR
 ************************************************************/

function retourIndex() {

  window.location.href =
    './index.html';

}

</script>

</body>
</html>
