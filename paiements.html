<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#7f1734"
>

<title>Consultation des paiements</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 1250px;
  margin: auto;
}

.header {
  background: linear-gradient(
    135deg,
    #6b1026,
    #8f1d3e
  );

  color: white;
  padding: 20px 25px;
  border-radius: 16px;
  margin-bottom: 18px;

  box-shadow:
    0 10px 30px
    rgba(107,16,38,.22);

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.header h1 {
  font-size: 25px;
  margin-bottom: 5px;
}

.header p {
  opacity: .85;
  font-size: 13px;
}

.btn-navigation {
  border: none;
  background: rgba(255,255,255,.16);
  color: white;
  padding: 11px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;

  box-shadow:
    0 4px 15px
    rgba(15,23,42,.06);

  border: 1px solid #e5e7eb;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
}

.source-selector {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.source-option {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.source-option input {
  width: auto;
  height: auto;
}

.filters {
  display: grid;
  grid-template-columns:
    1fr 1fr 1fr auto;

  gap: 13px;
  align-items: end;
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid #dbe2ea;
  border-radius: 9px;
  background: #f8fafc;
  font-size: 13px;
  outline: none;
}

input:focus,
select:focus {
  background: white;
  border-color: #7f1734;
}

.btn-search {
  height: 42px;
  padding: 0 20px;
  border: none;
  border-radius: 9px;
  background: #7f1734;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

.btn-search:disabled {
  opacity: .6;
  cursor: wait;
}

.loading {
  display: none;
  padding: 20px;
  text-align: center;
  color: #64748b;
}

.empty {
  display: none;
  padding: 30px;
  text-align: center;
  color: #64748b;
}

.stats {
  display: flex;
  gap: 15px;
  margin-bottom: 15px;
}

.stat {
  flex: 1;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 15px;
}

.stat-label {
  color: #64748b;
  font-size: 12px;
}

.stat-value {
  font-size: 21px;
  font-weight: 700;
  margin-top: 5px;
}

.table-container {
  display: none;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th {
  text-align: left;
  background: #f8fafc;
  color: #475569;
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
  white-space: nowrap;
}

td {
  padding: 11px 12px;
  border-bottom: 1px solid #eef2f7;
  white-space: nowrap;
}

.amount {
  text-align: right;
  font-weight: 700;
}

.motif {
  display: inline-block;
  padding: 5px 8px;
  border-radius: 7px;
  background: #f9e8ed;
  color: #7f1734;
}

@media(max-width:800px) {

  .filters {
    grid-template-columns: 1fr 1fr;
  }

  .btn-search {
    width: 100%;
  }

}

@media(max-width:600px) {

  body {
    padding: 12px;
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
  }

  .btn-navigation {
    width: 100%;
  }

  .filters {
    grid-template-columns: 1fr;
  }

  .stats {
    flex-direction: column;
  }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

  <div>

    <h1>
      Consultation des paiements
    </h1>

    <p>
      Consultation locale ou Google Sheets
    </p>

  </div>


  <button
    class="btn-navigation"
    onclick="retourIndex()">

    ← Retour à l'enregistrement

  </button>

</div>


<div class="card">

  <div class="card-title">
    Source des données
  </div>


  <div class="source-selector">

    <label class="source-option">

      <input
        type="radio"
        name="source"
        id="sourceLocal"
        value="local"
        checked
      >

      📱 Données locales

    </label>


    <label class="source-option">

      <input
        type="radio"
        name="source"
        id="sourceGoogle"
        value="google"
      >

      ☁️ Google Sheets

    </label>

  </div>


  <div class="filters">


    <div class="form-group">

      <label>
        Date de début
      </label>

      <input
        type="date"
        id="dateDebut"
      >

    </div>


    <div class="form-group">

      <label>
        Date de fin
      </label>

      <input
        type="date"
        id="dateFin"
      >

    </div>


    <div class="form-group">

      <label>
        Établissement
      </label>

      <select id="etablissement">

        <option value="">
          Tous les établissements
        </option>

        <option value="LS1">
          LS1
        </option>

        <option value="LS2">
          LS2
        </option>

        <option value="LS3">
          LS3
        </option>

      </select>

    </div>


    <button
      class="btn-search"
      id="btnSearch"
      onclick="rechercher()">

      🔎 Rechercher

    </button>


  </div>

</div>


<div
  class="loading"
  id="loading">

  ⏳ Recherche en cours...

</div>


<div class="stats">

  <div class="stat">

    <div class="stat-label">
      Nombre de paiements
    </div>

    <div
      class="stat-value"
      id="nombreResultats">

      0

    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Total
    </div>

    <div
      class="stat-value"
      id="totalPaiements">

      0 Ar

    </div>

  </div>

</div>


<div
  class="card table-container"
  id="tableContainer">

  <table>

    <thead>

      <tr>

        <th>Date</th>
        <th>Matricule</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Classe</th>
        <th>Établissement</th>
        <th>Motif</th>
        <th>Montant</th>

      </tr>

    </thead>


    <tbody id="paymentsTable">
    </tbody>

  </table>

</div>


<div
  class="card empty"
  id="emptyMessage">

  Aucun paiement trouvé pour ces critères.

</div>


<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzocTzSSVaTc7ThJQTrMdE4wjYg5yXrq58A5_KboS6kPXHD0mGEzh7GT7Jy7DOqOEiI/exec';


const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 2;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * SERVICE WORKER
 ************************************************************/

if (
  'serviceWorker' in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register(
          './service-worker.js'
        )
        .catch(
          function(erreur) {

            console.error(
              'Service Worker :',
              erreur
            );

          }
        );

    }
  );

}


/************************************************************
 * INDEXEDDB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath: 'id'
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * RECHERCHE LOCALE
 ************************************************************/

async function rechercherLocal(
  dateDebut,
  dateFin,
  etablissement
) {

  const db =
    await ouvrirDB();


  const elements =
    await new Promise(
      function(resolve, reject) {

        const transaction =
          db.transaction(
            STORE_PAIEMENTS,
            'readonly'
          );


        const request =
          transaction
            .objectStore(
              STORE_PAIEMENTS
            )
            .getAll();


        request.onsuccess =
          function() {

            resolve(
              request.result
            );

          };


        request.onerror =
          function() {

            reject(
              request.error
            );

          };

      }
    );


  const debut =
    new Date(
      dateDebut +
      'T00:00:00'
    );


  const fin =
    new Date(
      dateFin +
      'T23:59:59'
    );


  const resultat = [];


  elements.forEach(
    function(element) {

      const data =
        element.data;


      const date =
        new Date(
          element.dateCreation
        );


      if (
        etablissement &&
        data.etablissement !==
        etablissement
      ) {

        return;

      }


      if (
        date >= debut &&
        date <= fin
      ) {

        resultat.push({

          date:
            formatDateLocale(
              date
            ),

          matricule:
            data.matricule,

          nom:
            data.nom,

          prenom:
            data.prenom,

          classe:
            data.classe,

          montant:
            calculerMontantLocal(
              data
            ),

          etablissement:
            data.etablissement,

          motif:
            construireMotifLocal(
              data
            )

        });

      }

    }
  );


  resultat.sort(
    function(a, b) {

      return
        convertirDateAffichage(
          b.date
        ) -
        convertirDateAffichage(
          a.date
        );

    }
  );


  return resultat;

}


/************************************************************
 * RECHERCHE GOOGLE SHEETS
 ************************************************************/

async function rechercherGoogle(
  dateDebut,
  dateFin,
  etablissement
) {

  if (
    !navigator.onLine
  ) {

    throw new Error(
      'Une connexion Internet est nécessaire pour consulter Google Sheets.'
    );

  }


  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {

        method: 'POST',

        redirect: 'follow',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              'rechercherPaiements',

            dateDebut:
              dateDebut,

            dateFin:
              dateFin,

            etablissement:
              etablissement

          })

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      'Erreur HTTP ' +
      response.status
    );

  }


  const resultat =
    await response.json();


  if (
    !resultat.success
  ) {

    throw new Error(
      resultat.message
    );

  }


  return resultat.paiements;

}


/************************************************************
 * RECHERCHE PRINCIPALE
 ************************************************************/

async function rechercher() {

  const dateDebut =
    document
      .getElementById(
        'dateDebut'
      )
      .value;


  const dateFin =
    document
      .getElementById(
        'dateFin'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  const source =
    document
      .querySelector(
        'input[name="source"]:checked'
      )
      .value;


  if (
    !dateDebut ||
    !dateFin
  ) {

    alert(
      'Veuillez sélectionner les deux dates.'
    );

    return;

  }


  if (
    dateDebut >
    dateFin
  ) {

    alert(
      'La date de début doit être antérieure ou égale à la date de fin.'
    );

    return;

  }


  afficherLoading();


  const bouton =
    document
      .getElementById(
        'btnSearch'
      );


  bouton.disabled =
    true;


  try {

    let paiements;


    if (
      source ===
      'local'
    ) {

      /*
       * AUCUN INTERNET
       */

      paiements =
        await rechercherLocal(
          dateDebut,
          dateFin,
          etablissement
        );

    } else {

      /*
       * GOOGLE SHEETS
       */

      paiements =
        await rechercherGoogle(
          dateDebut,
          dateFin,
          etablissement
        );

    }


    afficherResultats(
      paiements
    );


  } catch (erreur) {

    afficherErreur(
      erreur
    );

  }


  bouton.disabled =
    false;

}


/************************************************************
 * AFFICHAGE
 ************************************************************/

function afficherLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'emptyMessage'
    )
    .style.display =
    'none';

}


function afficherResultats(
  paiements
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  const tbody =
    document
      .getElementById(
        'paymentsTable'
      );


  tbody.innerHTML =
    '';


  let total = 0;


  if (
    !paiements ||
    paiements.length === 0
  ) {

    document
      .getElementById(
        'tableContainer'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'emptyMessage'
      )
      .style.display =
      'block';


    document
      .getElementById(
        'nombreResultats'
      )
      .textContent =
      '0';


    document
      .getElementById(
        'totalPaiements'
      )
      .textContent =
      '0 Ar';


    return;

  }


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'emptyMessage'
    )
    .style.display =
    'none';


  paiements.forEach(
    function(paiement) {

      const montant =
        Number(
          paiement.montant
        ) || 0;


      const tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML = `

        <td>
          ${echapperHTML(
            paiement.date
          )}
        </td>

        <td>
          <strong>
            ${echapperHTML(
              paiement.matricule
            )}
          </strong>
        </td>

        <td>
          <strong>
            ${echapperHTML(
              paiement.nom
            )}
          </strong>
        </td>

        <td>
          ${echapperHTML(
            paiement.prenom
          )}
        </td>

        <td>
          ${echapperHTML(
            paiement.classe
          )}
        </td>

        <td>
          ${echapperHTML(
            paiement.etablissement
          )}
        </td>

        <td>
          <span class="motif">
            ${echapperHTML(
              paiement.motif
            )}
          </span>
        </td>

        <td class="amount">
          ${montant.toLocaleString(
            'fr-FR'
          )} Ar
        </td>

      `;


      tbody.appendChild(
        tr
      );


      total +=
        montant;

    }
  );


  document
    .getElementById(
      'nombreResultats'
    )
    .textContent =
    paiements.length;


  document
    .getElementById(
      'totalPaiements'
    )
    .textContent =
    total.toLocaleString(
      'fr-FR'
    ) +
    ' Ar';

}


/************************************************************
 * CALCUL LOCAL
 ************************************************************/

function valeurOuZero(
  valeur
) {

  const nombre =
    Number(
      valeur || 0
    );


  return isNaN(nombre)
    ? 0
    : nombre;

}


function calculerMontantLocal(
  data
) {

  let total = 0;


  total +=
    valeurOuZero(
      data.fraisGeneraux
    );


  total +=
    valeurOuZero(
      data.droit
    );


  total +=
    valeurOuZero(
      data.cravate
    );


  total +=
    valeurOuZero(
      data.teeShirt
    );


  total +=
    valeurOuZero(
      data.extra
    );


  if (
    data.ecolage === true
  ) {

    total +=
      valeurOuZero(
        data.montantEcolage
      )
      *
      valeurOuZero(
        data.nombreMois
      );

  }


  return total;

}


/************************************************************
 * MOTIF LOCAL
 ************************************************************/

function construireMotifLocal(
  data
) {

  const motifs = [];


  if (
    valeurOuZero(
      data.fraisGeneraux
    ) > 0
  ) {

    motifs.push(
      'Frais généraux'
    );

  }


  if (
    valeurOuZero(
      data.droit
    ) > 0
  ) {

    motifs.push(
      'Droit'
    );

  }


  if (
    valeurOuZero(
      data.cravate
    ) > 0
  ) {

    motifs.push(
      'Cravate'
    );

  }


  if (
    valeurOuZero(
      data.teeShirt
    ) > 0
  ) {

    motifs.push(
      'Tee-shirt'
    );

  }


  if (
    valeurOuZero(
      data.extra
    ) > 0
  ) {

    motifs.push(
      'Extra'
    );

  }


  if (
    data.ecolage === true &&
    valeurOuZero(
      data.montantEcolage
    ) > 0
  ) {

    motifs.push(
      'Écolage ' +
      data.nombreMois +
      ' mois'
    );

  }


  return motifs.join(
    ' + '
  );

}


/************************************************************
 * DATE
 ************************************************************/

function formatDateLocale(
  date
) {

  const jour =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );


  const mois =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const annee =
    date.getFullYear();


  const heures =
    String(
      date.getHours()
    ).padStart(
      2,
      '0'
    );


  const minutes =
    String(
      date.getMinutes()
    ).padStart(
      2,
      '0'
    );


  return (
    jour +
    '/' +
    mois +
    '/' +
    annee +
    ' ' +
    heures +
    ':' +
    minutes
  );

}


function convertirDateAffichage(
  texte
) {

  const morceaux =
    texte.split(
      ' '
    );


  const date =
    morceaux[0].split(
      '/'
    );


  const heure =
    morceaux[1]
      ? morceaux[1].split(':')
      : ['00','00'];


  return new Date(
    Number(date[2]),
    Number(date[1]) - 1,
    Number(date[0]),
    Number(heure[0]),
    Number(heure[1])
  );

}


/************************************************************
 * PROTECTION HTML
 ************************************************************/

function echapperHTML(
  valeur
) {

  return String(
    valeur ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/************************************************************
 * ERREUR
 ************************************************************/

function afficherErreur(
  erreur
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';


  alert(
    'Une erreur est survenue : ' +
    (
      erreur.message ||
      erreur
    )
  );

}


/************************************************************
 * RETOUR
 ************************************************************/

function retourIndex() {

  window.location.href =
    'index.html';

}


/************************************************************
 * DATE DU JOUR
 ************************************************************/

function dateAujourdhui() {

  const maintenant =
    new Date();


  const annee =
    maintenant.getFullYear();


  const mois =
    String(
      maintenant.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const jour =
    String(
      maintenant.getDate()
    ).padStart(
      2,
      '0'
    );


  return (
    annee +
    '-' +
    mois +
    '-' +
    jour
  );

}


/************************************************************
 * DEMARRAGE
 ************************************************************/

window.addEventListener(
  'load',
  function() {

    const aujourdHui =
      dateAujourdhui();


    document
      .getElementById(
        'dateDebut'
      )
      .value =
      aujourdHui;


    document
      .getElementById(
        'dateFin'
      )
      .value =
      aujourdHui;

  }
);

</script>

</body>

</html>
