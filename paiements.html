<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Consultation des paiements</title>

<style>

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#fdf2f5,#f8fafc,#fff7ed);
  color:#1e293b;
  min-height:100vh;
  padding:20px;
}

.container {
  max-width:1250px;
  margin:auto;
}

.header {
  background:linear-gradient(135deg,#5b0b20,#8f1d3e,#b8325a);
  color:white;
  padding:20px 25px;
  border-radius:17px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  box-shadow:0 12px 30px rgba(107,16,38,.22);
}

.header h1 {
  font-size:24px;
}

.header p {
  font-size:13px;
  opacity:.85;
  margin-top:4px;
}

.btn {
  border:none;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:600;
}

.btn-back {
  background:rgba(255,255,255,.16);
  color:white;
}

.card {
  background:rgba(255,255,255,.94);
  padding:20px;
  border-radius:15px;
  border:1px solid #f1dce3;
  box-shadow:0 5px 18px rgba(15,23,42,.07);
  margin-bottom:16px;
}

.filters {
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:13px;
  align-items:end;
}

.form-group {
  display:flex;
  flex-direction:column;
}

label {
  font-size:12px;
  font-weight:600;
  color:#475569;
  margin-bottom:6px;
}

input,
select {
  height:42px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  background:#f8fafc;
  padding:0 12px;
  outline:none;
}

input:focus,
select:focus {
  border-color:#8f1d3e;
  background:white;
}

.btn-search {
  height:42px;
  background:#8f1d3e;
  color:white;
}

.radio-box {
  display:flex;
  gap:20px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.radio-option {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.radio-option input {
  width:auto;
  height:auto;
  accent-color:#8f1d3e;
}

.table-wrapper {
  overflow:auto;
  border-radius:10px;
}

table {
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th {
  background:#651029;
  color:white;
  padding:11px;
  font-size:12px;
  text-align:left;
  white-space:nowrap;
}

td {
  padding:10px;
  border-bottom:1px solid #edf0f3;
  font-size:12px;
  white-space:nowrap;
}

tr:nth-child(even) td {
  background:#fff8fa;
}

.amount {
  text-align:right;
  font-weight:700;
}

.motif {
  background:#f9e8ed;
  color:#7f1734;
  padding:5px 8px;
  border-radius:7px;
}

.summary {
  display:flex;
  gap:12px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.summary-box {
  padding:12px 17px;
  background:#fff;
  border:1px solid #f1dce3;
  border-radius:10px;
}

.summary-label {
  color:#64748b;
  font-size:11px;
}

.summary-value {
  color:#7f1734;
  font-weight:700;
  font-size:17px;
}

.loading,
.empty {
  display:none;
  padding:30px;
  text-align:center;
  color:#64748b;
}

@media(max-width:750px) {

  .header {
    flex-direction:column;
    align-items:flex-start;
  }

  .filters {
    grid-template-columns:1fr;
  }

  .btn-search {
    width:100%;
  }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

  <div>

    <h1>Consultation des paiements</h1>

    <p>
      Consultation locale ou depuis Google Sheets
    </p>

  </div>

  <button
    class="btn btn-back"
    onclick="retourIndex()">

    ← Retour

  </button>

</div>


<div class="card">

  <div class="radio-box">

    <label class="radio-option">

      <input
        type="radio"
        name="source"
        value="local"
        checked
        onchange="changerSource()">

      📱 Données locales

    </label>


    <label class="radio-option">

      <input
        type="radio"
        name="source"
        value="google"
        onchange="changerSource()">

      ☁️ Google Sheets

    </label>

  </div>


  <div class="filters">

    <div class="form-group">

      <label>Date début</label>

      <input
        type="date"
        id="dateDebut">

    </div>


    <div class="form-group">

      <label>Date fin</label>

      <input
        type="date"
        id="dateFin">

    </div>


    <div class="form-group">

      <label>Établissement</label>

      <select id="etablissement">

        <option value="">
          Tous les établissements
        </option>

        <option>LS1</option>
        <option>LS2</option>
        <option>LS3</option>

      </select>

    </div>


    <button
      class="btn btn-search"
      onclick="rechercher()">

      🔎 Chercher

    </button>

  </div>

</div>


<div class="summary">

  <div class="summary-box">

    <div class="summary-label">
      Nombre de paiements
    </div>

    <div
      class="summary-value"
      id="nombreResultats">

      0

    </div>

  </div>


  <div class="summary-box">

    <div class="summary-label">
      Total
    </div>

    <div
      class="summary-value"
      id="totalPaiements">

      0 Ar

    </div>

  </div>

</div>


<div
  class="card"
  id="tableContainer"
  style="display:none">

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>Date</th>
          <th>Matricule</th>
          <th>Nom</th>
          <th>Classe</th>
          <th>Établissement</th>
          <th>Motif</th>
          <th>Montant</th>

        </tr>

      </thead>

      <tbody id="paymentsTable"></tbody>

    </table>

  </div>

</div>


<div
  class="card loading"
  id="loading">

  ⏳ Recherche en cours...

</div>


<div
  class="card empty"
  id="emptyMessage">

  Aucun paiement trouvé pour ces critères.

</div>


</div>


<script>

/************************************************************
 * CONFIGURATION LOCALE
 ************************************************************/

const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 3;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * INDEXED DB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve,reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath:'id',
                autoIncrement:true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * LECTURE LOCALE
 ************************************************************/

async function rechercherLocal(
  dateDebut,
  dateFin,
  etablissement
) {

  const db =
    await ouvrirDB();


  const elements =
    await new Promise(
      function(resolve,reject) {

        const request =
          db
            .transaction(
              STORE_PAIEMENTS,
              'readonly'
            )
            .objectStore(
              STORE_PAIEMENTS
            )
            .getAll();


        request.onsuccess =
          function() {

            resolve(
              request.result
            );

          };


        request.onerror =
          function() {

            reject(
              request.error
            );

          };

      }
    );


  const debut =
    new Date(
      dateDebut +
      'T00:00:00'
    );


  const fin =
    new Date(
      dateFin +
      'T23:59:59'
    );


  const resultat = [];


  elements.forEach(
    function(element) {

      const date =
        new Date(
          element.dateCreation
        );


      const data =
        element.data;


      if (
        date < debut ||
        date > fin
      ) {

        return;

      }


      if (
        etablissement &&
        data.etablissement !==
        etablissement
      ) {

        return;

      }


      const montant =
        calculerMontant(data);


      resultat.push({

        date:
          formatDateLocale(date),

        matricule:
          genererMatricule(
            data.nom,
            data.classe,
            data.etablissement
          ),

        nom:
          data.nom,

        classe:
          data.classe,

        etablissement:
          data.etablissement,

        motif:
          construireMotif(data),

        montant:
          montant

      });

    }
  );


  resultat.reverse();


  return resultat;

}


/************************************************************
 * CALCUL LOCAL
 ************************************************************/

function valeurOuZero(v) {

  const n =
    Number(v);

  return isNaN(n)
    ? 0
    : n;

}


function calculerMontant(data) {

  let total = 0;

  total += valeurOuZero(data.droit);
  total += valeurOuZero(data.fraisGeneraux);
  total += valeurOuZero(data.fram);
  total += valeurOuZero(data.teeShirt);
  total += valeurOuZero(data.cravate);
  total += valeurOuZero(data.short);
  total += valeurOuZero(data.extra);


  if (
    data.ecolage === true
  ) {

    total +=
      valeurOuZero(
        data.montantEcolage
      ) *
      valeurOuZero(
        data.nombreMois
      );

  }


  return total;

}


/************************************************************
 * MATRICULE LOCAL
 ************************************************************/

function genererMatricule(
  nom,
  classe,
  etablissement
) {

  function normaliser(v) {

    return String(v || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-zA-Z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'')
      .toUpperCase();

  }


  return (
    normaliser(nom) +
    '-' +
    normaliser(classe) +
    '-' +
    normaliser(etablissement)
  );

}


/************************************************************
 * MOTIF
 ************************************************************/

function construireMotif(data) {

  const motifs = [];


  if (valeurOuZero(data.droit) > 0)
    motifs.push('Droit');

  if (valeurOuZero(data.fraisGeneraux) > 0)
    motifs.push('Frais généraux');

  if (valeurOuZero(data.fram) > 0)
    motifs.push('FRAM');

  if (valeurOuZero(data.teeShirt) > 0)
    motifs.push('Tee-shirt');

  if (valeurOuZero(data.cravate) > 0)
    motifs.push('Cravate');

  if (valeurOuZero(data.short) > 0)
    motifs.push('Short');

  if (valeurOuZero(data.extra) > 0)
    motifs.push('Extra');


  if (
    data.ecolage === true &&
    valeurOuZero(data.montantEcolage) > 0
  ) {

    motifs.push(
      'Écolage ' +
      data.nombreMois +
      ' mois'
    );

  }


  return motifs.join(' + ');

}


/************************************************************
 * RECHERCHE GOOGLE SHEETS
 ************************************************************/

function rechercherServeur(
  dateDebut,
  dateFin,
  etablissement
) {

  return new Promise(
    function(resolve,reject) {

      google.script.run

        .withSuccessHandler(
          function(resultat) {

            resolve(
              resultat
            );

          }
        )

        .withFailureHandler(
          reject
        )

        .rechercherPaiements(
          dateDebut,
          dateFin,
          etablissement
        );

    }
  );

}


/************************************************************
 * RECHERCHE
 ************************************************************/

async function rechercher() {

  const dateDebut =
    document
      .getElementById(
        'dateDebut'
      )
      .value;


  const dateFin =
    document
      .getElementById(
        'dateFin'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  if (
    !dateDebut ||
    !dateFin
  ) {

    alert(
      'Veuillez sélectionner les deux dates.'
    );

    return;

  }


  if (
    dateDebut > dateFin
  ) {

    alert(
      'La date de début doit être antérieure ou égale à la date de fin.'
    );

    return;

  }


  afficherLoading();


  try {

    const source =
      document.querySelector(
        'input[name="source"]:checked'
      ).value;


    let paiements;


    if (
      source === 'local'
    ) {

      paiements =
        await rechercherLocal(
          dateDebut,
          dateFin,
          etablissement
        );

    } else {

      paiements =
        await rechercherServeur(
          dateDebut,
          dateFin,
          etablissement
        );

    }


    afficherResultats(
      paiements
    );


  } catch(erreur) {

    afficherErreur(
      erreur
    );

  }

}


/************************************************************
 * AFFICHAGE
 ************************************************************/

function afficherLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';

  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';

  document
    .getElementById(
      'emptyMessage'
    )
    .style.display =
    'none';

}


function echapperHTML(v) {

  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function afficherResultats(paiements) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  const tbody =
    document.getElementById(
      'paymentsTable'
    );


  tbody.innerHTML = '';


  let total = 0;


  if (
    !paiements ||
    paiements.length === 0
  ) {

    document
      .getElementById(
        'tableContainer'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'emptyMessage'
      )
      .style.display =
      'block';


    document
      .getElementById(
        'nombreResultats'
      )
      .textContent =
      '0';


    document
      .getElementById(
        'totalPaiements'
      )
      .textContent =
      '0 Ar';


    return;

  }


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'emptyMessage'
    )
    .style.display =
    'none';


  paiements.forEach(
    function(paiement) {

      const montant =
        Number(
          paiement.montant
        ) || 0;


      const tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML = `

        <td>${echapperHTML(paiement.date)}</td>

        <td>
          <strong>
            ${echapperHTML(paiement.matricule)}
          </strong>
        </td>

        <td>
          <strong>
            ${echapperHTML(paiement.nom)}
          </strong>
        </td>

        <td>${echapperHTML(paiement.classe)}</td>

        <td>${echapperHTML(paiement.etablissement)}</td>

        <td>
          <span class="motif">
            ${echapperHTML(paiement.motif)}
          </span>
        </td>

        <td class="amount">
          ${montant.toLocaleString('fr-FR')} Ar
        </td>

      `;


      tbody.appendChild(tr);

      total += montant;

    }
  );


  document
    .getElementById(
      'nombreResultats'
    )
    .textContent =
    paiements.length;


  document
    .getElementById(
      'totalPaiements'
    )
    .textContent =
    total.toLocaleString(
      'fr-FR'
    ) + ' Ar';

}


function afficherErreur(erreur) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  alert(
    'Une erreur est survenue : ' +
    (
      erreur.message ||
      erreur
    )
  );

}


function changerSource() {

  /*
   * Aucun appel automatique.
   * La recherche se fait uniquement
   * lorsque l'utilisateur clique sur Chercher.
   */

}


function retourIndex() {

  window.location.href =
    'index.html';

}


/************************************************************
 * DATE DU JOUR
 ************************************************************/

function dateAujourdhui() {

  const date =
    new Date();


  return (
    date.getFullYear() +
    '-' +
    String(
      date.getMonth() + 1
    ).padStart(2,'0') +
    '-' +
    String(
      date.getDate()
    ).padStart(2,'0')
  );

}


document
  .getElementById(
    'dateDebut'
  )
  .value =
  dateAujourdhui();


document
  .getElementById(
    'dateFin'
  )
  .value =
  dateAujourdhui();

</script>

</body>
</html>
