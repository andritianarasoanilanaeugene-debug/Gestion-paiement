<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Consultation des paiements</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  min-height: 100vh;

  padding: 22px;

  background:
    radial-gradient(
      circle at top right,
      #f7d8e2,
      #f3eef1 32%,
      #edf1f6
    );

  color: #29222d;

}

.container {

  max-width: 1250px;

  margin: auto;

}

.header {

  background:
    linear-gradient(
      135deg,
      #5c0c25,
      #86153b,
      #b83260
    );

  color: white;

  padding: 23px 27px;

  border-radius: 19px;

  margin-bottom: 17px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 15px;

  box-shadow:
    0 14px 30px
    rgba(92,12,37,.23);

}

.header h1 {

  font-size: 25px;

  margin-bottom: 5px;

}

.header p {

  font-size: 13px;

  opacity: .85;

}

.btn {

  border: none;

  border-radius: 10px;

  padding:
    11px 16px;

  font-weight: 700;

  cursor: pointer;

}

.btn-back {

  background:
    rgba(255,255,255,.16);

  color: white;

}

.btn-search {

  background:
    linear-gradient(
      135deg,
      #86153b,
      #bd3764
    );

  color: white;

}

.card {

  background:
    rgba(255,255,255,.94);

  border:
    1px solid #e6dbe0;

  border-radius: 16px;

  padding: 19px;

  margin-bottom: 15px;

  box-shadow:
    0 6px 22px
    rgba(31,18,30,.06);

}

.filters {

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr auto;

  gap: 13px;

  align-items: end;

}

label {

  display: block;

  font-size: 12px;

  font-weight: 700;

  color: #5e5260;

  margin-bottom: 6px;

}

input,
select {

  width: 100%;

  height: 43px;

  border:
    1px solid #ddd3d9;

  border-radius: 10px;

  padding:
    0 11px;

  background: #fcfafb;

  outline: none;

}

input:focus,
select:focus {

  border-color: #a32650;

  box-shadow:
    0 0 0 3px
    rgba(163,38,80,.10);

}

.mode {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 16px;

}

.mode label {

  margin: 0;

}

.mode-option {

  position: relative;

}

.mode-option input {

  display: none;

}

.mode-option span {

  display: block;

  padding:
    10px 15px;

  border-radius: 10px;

  border:
    1px solid #e1d4db;

  background: #fbf8fa;

  color: #6b5c65;

  cursor: pointer;

  font-size: 12px;

  font-weight: 700;

}

.mode-option input:checked
+ span {

  background:
    #f7d8e1;

  border-color:
    #b62d5c;

  color:
    #7d1237;

}

.info {

  font-size: 12px;

  color: #746771;

  margin-bottom: 12px;

}

.table-wrapper {

  overflow-x: auto;

  border-radius: 12px;

  border:
    1px solid #e4dbe0;

}

table {

  width: 100%;

  border-collapse:
    collapse;

  min-width: 950px;

}

thead {

  background:
    linear-gradient(
      90deg,
      #67102b,
      #8f1d43
    );

  color: white;

}

th {

  padding:
    13px 11px;

  font-size: 11px;

  text-align: left;

  white-space: nowrap;

}

td {

  padding:
    12px 11px;

  font-size: 12px;

  border-bottom:
    1px solid #eee6ea;

  white-space: nowrap;

}

tbody tr:nth-child(even) {

  background: #fff8fa;

}

tbody tr:hover {

  background: #f8e7ed;

}

.amount {

  font-weight: 800;

  color: #86153b;

}

.motif {

  color: #6d5963;

}

.stats {

  display: flex;

  gap: 12px;

  margin-bottom: 15px;

  flex-wrap: wrap;

}

.stat {

  flex: 1;

  min-width: 180px;

  padding: 15px;

  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #f8e8ed
    );

  border:
    1px solid #ead7de;

}

.stat-title {

  color: #806d76;

  font-size: 11px;

}

.stat-value {

  font-size: 20px;

  font-weight: 800;

  color: #781333;

}

.loading,
.empty {

  text-align: center;

  padding: 35px;

  color: #776872;

}

@media(max-width:750px) {

  body {
    padding: 12px;
  }

  .header {

    flex-direction: column;

    align-items: flex-start;

  }

  .filters {

    grid-template-columns: 1fr;

  }

}

</style>

</head>


<body>

<div class="container">


<div class="header">

  <div>

    <h1>Consultation des paiements</h1>

    <p>
      Paiements enregistrés
    </p>

  </div>


  <button
    class="btn btn-back"
    onclick="retourIndex()">

    ← Retour

  </button>

</div>


<div class="card">


  <div class="mode">

    <label class="mode-option">

      <input
        type="radio"
        name="source"
        value="local"
        checked
        onchange="changerSource()"
      >

      <span>
        📱 Données locales
      </span>

    </label>


    <label class="mode-option">

      <input
        type="radio"
        name="source"
        value="serveur"
        onchange="changerSource()"
      >

      <span>
        ☁️ Google Sheets
      </span>

    </label>

  </div>


  <div class="filters">


    <div>

      <label>Date début</label>

      <input
        type="date"
        id="dateDebut"
      >

    </div>


    <div>

      <label>Date fin</label>

      <input
        type="date"
        id="dateFin"
      >

    </div>


    <div>

      <label>Établissement</label>

      <select id="etablissement">

        <option value="">
          Tous les établissements
        </option>

        <option>LS1</option>
        <option>LS2</option>
        <option>LS3</option>

      </select>

    </div>


    <button
      class="btn btn-search"
      onclick="rechercher()">

      🔎 Rechercher

    </button>

  </div>

</div>


<div
  id="loading"
  class="card loading"
  style="display:none">

  ⏳ Recherche en cours...

</div>


<div
  id="stats"
  class="stats"
  style="display:none">

  <div class="stat">

    <div class="stat-title">
      Nombre de paiements
    </div>

    <div
      id="nombreResultats"
      class="stat-value">
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      Montant total
    </div>

    <div class="stat-value">

      <span id="totalPaiements">
        0
      </span>

      Ar

    </div>

  </div>

</div>


<div
  id="tableContainer"
  class="card"
  style="display:none">


  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>Date</th>
          <th>Matricule</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Classe</th>
          <th>Établissement</th>
          <th>Motif</th>
          <th>Montant</th>

        </tr>

      </thead>


      <tbody id="paymentsTable">
      </tbody>

    </table>

  </div>

</div>


<div
  id="emptyMessage"
  class="card empty"
  style="display:none">

  Aucun paiement trouvé.

</div>


<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzh347Syf1dDfNrCKhvXwE7Lv5IszkBk739PGn7o7LGef_5UlxVU0aAD15GzsCKXRiM/exec';


const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 1;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * INDEXEDDB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath: 'id',
                autoIncrement: true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SOURCE
 ************************************************************/

function sourceSelectionnee() {

  return document
    .querySelector(
      'input[name="source"]:checked'
    )
    .value;

}


function changerSource() {

  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';

  document
    .getElementById(
      'stats'
    )
    .style.display =
    'none';

}


/************************************************************
 * RECHERCHE LOCALE
 ************************************************************/

async function rechercherLocal(
  dateDebut,
  dateFin,
  etablissement
) {

  const db =
    await ouvrirDB();


  const elements =
    await new Promise(
      function(resolve, reject) {

        const request =
          db
            .transaction(
              STORE_PAIEMENTS,
              'readonly'
            )
            .objectStore(
              STORE_PAIEMENTS
            )
            .getAll();


        request.onsuccess =
          function() {

            resolve(
              request.result
            );

          };


        request.onerror =
          function() {

            reject(
              request.error
            );

          };

      }
    );


  const debut =
    new Date(
      dateDebut +
      'T00:00:00'
    );


  const fin =
    new Date(
      dateFin +
      'T23:59:59'
    );


  const resultat = [];


  elements.forEach(
    function(element) {

      const data =
        element.data;


      const date =
        new Date(
          element.dateCreation
        );


      if (
        etablissement &&
        data.etablissement !==
        etablissement
      ) {

        return;

      }


      if (
        date >= debut &&
        date <= fin
      ) {

        resultat.push({

          date:
            formatDateLocale(
              date
            ),

          matricule:
            data.matricule,

          nom:
            data.nom,

          prenom:
            data.prenom,

          classe:
            data.classe,

          montant:
            calculerMontantLocal(
              data
            ),

          etablissement:
            data.etablissement,

          motif:
            construireMotifLocal(
              data
            )

        });

      }

    }
  );


  resultat.reverse();


  return resultat;

}


/************************************************************
 * RECHERCHE SERVEUR
 ************************************************************/

async function rechercherServeur(
  dateDebut,
  dateFin,
  etablissement
) {

  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {

        method: 'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              'rechercherPaiements',

            dateDebut:
              dateDebut,

            dateFin:
              dateFin,

            etablissement:
              etablissement

          })

      }
    );


  const resultat =
    await response.json();


  if (
    !resultat.success
  ) {

    throw new Error(
      resultat.message
    );

  }


  return resultat.paiements;

}


/************************************************************
 * RECHERCHE PRINCIPALE
 ************************************************************/

async function rechercher() {

  const dateDebut =
    document
      .getElementById(
        'dateDebut'
      )
      .value;


  const dateFin =
    document
      .getElementById(
        'dateFin'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  if (
    !dateDebut ||
    !dateFin
  ) {

    alert(
      'Veuillez sélectionner les deux dates.'
    );

    return;

  }


  if (
    dateDebut >
    dateFin
  ) {

    alert(
      'La date de début doit être antérieure ou égale à la date de fin.'
    );

    return;

  }


  afficherLoading();


  try {

    let paiements;


    if (
      sourceSelectionnee()
      ===
      'local'
    ) {

      paiements =
        await rechercherLocal(
          dateDebut,
          dateFin,
          etablissement
        );

    } else {

      if (
        !navigator.onLine
      ) {

        throw new Error(
          'Une connexion Internet est nécessaire pour consulter Google Sheets.'
        );

      }


      paiements =
        await rechercherServeur(
          dateDebut,
          dateFin,
          etablissement
        );

    }


    afficherResultats(
      paiements
    );


  } catch (erreur) {

    afficherErreur(
      erreur
    );

  }

}


/************************************************************
 * RESULTATS
 ************************************************************/

function afficherResultats(
  paiements
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  const tbody =
    document.getElementById(
      'paymentsTable'
    );


  tbody.innerHTML = '';


  if (
    !paiements ||
    paiements.length === 0
  ) {

    document
      .getElementById(
        'tableContainer'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'stats'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'emptyMessage'
      )
      .style.display =
      'block';


    return;

  }


  document
    .getElementById(
      'emptyMessage'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'stats'
    )
    .style.display =
    'flex';


  let total = 0;


  paiements.forEach(
    function(paiement) {

      const montant =
        Number(
          paiement.montant
        ) || 0;


      total += montant;


      const tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML = `

        <td>${echapperHTML(
          paiement.date
        )}</td>

        <td>
          <strong>${echapperHTML(
            paiement.matricule
          )}</strong>
        </td>

        <td>
          <strong>${echapperHTML(
            paiement.nom
          )}</strong>
        </td>

        <td>${echapperHTML(
          paiement.prenom
        )}</td>

        <td>${echapperHTML(
          paiement.classe
        )}</td>

        <td>${echapperHTML(
          paiement.etablissement
        )}</td>

        <td>
          <span class="motif">
            ${echapperHTML(
              paiement.motif
            )}
          </span>
        </td>

        <td class="amount">
          ${montant.toLocaleString(
            'fr-FR'
          )} Ar
        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );


  document
    .getElementById(
      'nombreResultats'
    )
    .textContent =
    paiements.length;


  document
    .getElementById(
      'totalPaiements'
    )
    .textContent =
    total.toLocaleString(
      'fr-FR'
    );

}


/************************************************************
 * CALCUL LOCAL
 ************************************************************/

function valeurOuZero(
  valeur
) {

  const nombre =
    Number(
      valeur || 0
    );


  return isNaN(nombre)
    ? 0
    : nombre;

}


function calculerMontantLocal(
  data
) {

  let total = 0;


  total +=
    valeurOuZero(
      data.fraisGeneraux
    );

  total +=
    valeurOuZero(
      data.droit
    );

  total +=
    valeurOuZero(
      data.cravate
    );

  total +=
    valeurOuZero(
      data.teeShirt
    );

  total +=
    valeurOuZero(
      data.extra
    );


  if (
    data.ecolage === true
  ) {

    total +=
      valeurOuZero(
        data.montantEcolage
      )
      *
      valeurOuZero(
        data.nombreMois
      );

  }


  return total;

}


/************************************************************
 * MOTIF
 ************************************************************/

function construireMotifLocal(
  data
) {

  const motifs = [];


  if (
    valeurOuZero(
      data.fraisGeneraux
    ) > 0
  ) {

    motifs.push(
      'Frais généraux'
    );

  }


  if (
    valeurOuZero(
      data.droit
    ) > 0
  ) {

    motifs.push(
      'Droit'
    );

  }


  if (
    valeurOuZero(
      data.cravate
    ) > 0
  ) {

    motifs.push(
      'Cravate'
    );

  }


  if (
    valeurOuZero(
      data.teeShirt
    ) > 0
  ) {

    motifs.push(
      'Tee-shirt'
    );

  }


  if (
    valeurOuZero(
      data.extra
    ) > 0
  ) {

    motifs.push(
      'Extra'
    );

  }


  if (
    data.ecolage === true &&
    valeurOuZero(
      data.montantEcolage
    ) > 0
  ) {

    motifs.push(
      'Écolage ' +
      data.nombreMois +
      ' mois'
    );

  }


  return motifs.join(
    ' + '
  );

}


/************************************************************
 * FORMAT DATE
 ************************************************************/

function formatDateLocale(
  date
) {

  return (
    String(
      date.getDate()
    ).padStart(2,'0')
    +
    '/' +
    String(
      date.getMonth() + 1
    ).padStart(2,'0')
    +
    '/' +
    date.getFullYear()
    +
    ' ' +
    String(
      date.getHours()
    ).padStart(2,'0')
    +
    ':' +
    String(
      date.getMinutes()
    ).padStart(2,'0')
  );

}


/************************************************************
 * PROTECTION HTML
 ************************************************************/

function echapperHTML(
  valeur
) {

  return String(
    valeur ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/************************************************************
 * LOADING
 ************************************************************/

function afficherLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';

  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';

  document
    .getElementById(
      'stats'
    )
    .style.display =
    'none';

  document
    .getElementById(
      'emptyMessage'
    )
    .style.display =
    'none';

}


function afficherErreur(
  erreur
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  alert(
    'Une erreur est survenue : ' +
    (
      erreur.message ||
      erreur
    )
  );

}


/************************************************************
 * DATES
 ************************************************************/

function dateAujourdhui() {

  const date =
    new Date();


  return (
    date.getFullYear()
    +
    '-' +
    String(
      date.getMonth() + 1
    ).padStart(2,'0')
    +
    '-' +
    String(
      date.getDate()
    ).padStart(2,'0')
  );

}


document
  .getElementById(
    'dateDebut'
  )
  .value =
  dateAujourdhui();


document
  .getElementById(
    'dateFin'
  )
  .value =
  dateAujourdhui();


function retourIndex() {

  window.location.href =
    'index.html';

}

</script>

</body>

</html>
