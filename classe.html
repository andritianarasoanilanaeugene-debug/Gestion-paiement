<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Paiements par classe</title>

<style>

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #f8dbe5,
      transparent 35%
    ),
    #f8f1f4;

  color:#1e293b;

  min-height:100vh;

  padding:20px;

}

.container {

  max-width:1600px;

  margin:auto;

}

.header {

  background:
    linear-gradient(
      135deg,
      #5b0b20,
      #8f1d3e,
      #b8325a
    );

  color:white;

  padding:20px 25px;

  border-radius:18px;

  margin-bottom:18px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

}

.header h1 {

  font-size:24px;

}

.header p {

  font-size:13px;

  opacity:.85;

  margin-top:4px;

}

.btn {

  border:none;

  border-radius:10px;

  padding:11px 15px;

  cursor:pointer;

  font-weight:700;

}

.btn-back {

  background:
    rgba(255,255,255,.16);

  color:white;

}

.card {

  background:
    rgba(255,255,255,.96);

  padding:20px;

  border-radius:16px;

  border:
    1px solid #ead7df;

  box-shadow:
    0 5px 18px
    rgba(15,23,42,.07);

  margin-bottom:16px;

}

.filters {

  display:grid;

  grid-template-columns:
    1fr 1fr auto;

  gap:13px;

  align-items:end;

}

.form-group {

  display:flex;

  flex-direction:column;

}

label {

  font-size:12px;

  font-weight:700;

  color:#475569;

  margin-bottom:6px;

}

select {

  height:42px;

  border:
    1px solid #dbe2ea;

  border-radius:9px;

  background:#f8fafc;

  padding:0 12px;

  outline:none;

}

.btn-search {

  height:42px;

  background:#8f1d3e;

  color:white;

}

.table-wrapper {

  overflow:auto;

  border-radius:10px;

}

table {

  width:100%;

  border-collapse:collapse;

  min-width:1450px;

}

th {

  background:#651029;

  color:white;

  padding:11px 9px;

  font-size:11px;

  text-align:left;

  white-space:nowrap;

}

td {

  padding:9px;

  border-bottom:
    1px solid #edf0f3;

  font-size:11px;

  white-space:pre-line;

  vertical-align:top;

}

tr:nth-child(even) td {

  background:#fff8fa;

}

.loading,
.empty {

  display:none;

  text-align:center;

  padding:30px;

  color:#64748b;

}

@media(max-width:700px) {

  .header {

    flex-direction:column;

    align-items:flex-start;

  }

  .filters {

    grid-template-columns:1fr;

  }

  .btn-search {

    width:100%;

  }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

  <div>

    <h1>Paiements par classe</h1>

    <p>
      Consultation directe de Google Sheets
    </p>

  </div>


  <button
    class="btn btn-back"
    onclick="retourIndex()">

    ← Accueil

  </button>

</div>


<div class="card">

  <div class="filters">

    <div class="form-group">

      <label>Classe *</label>

      <select id="classe">

        <option value="">
          Sélectionner
        </option>

        <option>PS</option>
        <option>MS</option>
        <option>12ème</option>
        <option>11ème</option>
        <option>10ème</option>
        <option>9ème</option>
        <option>8ème</option>
        <option>7ème</option>
        <option>6ème</option>
        <option>5ème</option>
        <option>4ème</option>
        <option>3ème</option>
        <option>2nde</option>
        <option>1ère</option>
        <option>Terminale</option>

      </select>

    </div>


    <div class="form-group">

      <label>Établissement</label>

      <select id="etablissement">

        <option value="">
          Tous les établissements
        </option>

        <option>LS1</option>
        <option>LS2</option>
        <option>LS3</option>

      </select>

    </div>


    <button
      class="btn btn-search"
      id="btnRecherche"
      onclick="rechercher()">

      🔎 Chercher

    </button>

  </div>

</div>


<div
  class="card loading"
  id="loading">

  ⏳ Chargement des données Google Sheets...

</div>


<div
  class="card empty"
  id="empty">

  Aucun étudiant trouvé.

</div>


<div
  class="card"
  id="tableContainer"
  style="display:none;">

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>Matricule</th>
          <th>Nom</th>
          <th>Droit</th>
          <th>Frais généraux</th>
          <th>FRAM</th>
          <th>Tee-shirt</th>
          <th>Cravate</th>
          <th>Short</th>
          <th>Extra</th>
          <th>Septembre</th>
          <th>Octobre</th>
          <th>Novembre</th>
          <th>Décembre</th>
          <th>Janvier</th>
          <th>Février</th>
          <th>Mars</th>
          <th>Avril</th>
          <th>Mai</th>
          <th>Juin</th>
          <th>Etablissement</th>

        </tr>

      </thead>

      <tbody
        id="classeTable">
      </tbody>

    </table>

  </div>

</div>

</div>


<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzJBIds7jRI2DUTioirCcT23vHZQso4V8iqofmpU8fTbULaoNKlvHqcV0g-FIvgDHai/exec';


/************************************************************
 * SERVICE WORKER
 ************************************************************/

if (
  'serviceWorker' in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register(
          './service-worker.js'
        )
        .catch(
          console.warn
        );

    }
  );

}


/************************************************************
 * RECHERCHE
 ************************************************************/

async function rechercher() {

  const classe =
    document
      .getElementById(
        'classe'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  if (!classe) {

    alert(
      'Veuillez sélectionner une classe.'
    );

    return;

  }


  if (
    !navigator.onLine
  ) {

    alert(
      'La recherche par classe nécessite une connexion Internet.'
    );

    return;

  }


  afficherLoading();


  const bouton =
    document.getElementById(
      'btnRecherche'
    );


  bouton.disabled =
    true;


  bouton.textContent =
    '⏳ Recherche...';


  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {

          method:'POST',

          headers:{

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'rechercherClasse',

              classe:
                classe,

              etablissement:
                etablissement

            })

        }
      );


    const resultat =
      await response.json();


    if (
      !resultat.success
    ) {

      throw new Error(
        resultat.message
      );

    }


    afficherResultats(
      resultat.lignes || []
    );


  } catch(erreur) {

    afficherErreur(
      erreur
    );

  } finally {

    bouton.disabled =
      false;

    bouton.textContent =
      '🔎 Chercher';

  }

}


/************************************************************
 * FORMAT
 ************************************************************/

function formatMontant(
  valeur
) {

  /*
   * Les cellules de classe peuvent
   * maintenant contenir :
   *
   * 50000 Ar
   * Payé
   * 16/09/2026
   *
   * Donc on ne transforme pas
   * les cellules texte.
   */

  if (
    valeur === null ||
    valeur === undefined ||
    valeur === ''
  ) {

    return '';

  }


  if (
    typeof valeur === 'number'
  ) {

    return (
      valeur.toLocaleString(
        'fr-FR'
      ) +
      ' Ar'
    );

  }


  return String(
    valeur
  );

}


function echapperHTML(
  valeur
) {

  return String(
    valeur ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/************************************************************
 * AFFICHAGE
 ************************************************************/

function afficherResultats(
  lignes
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  const tbody =
    document.getElementById(
      'classeTable'
    );


  tbody.innerHTML =
    '';


  if (
    !lignes ||
    lignes.length === 0
  ) {

    document
      .getElementById(
        'tableContainer'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'empty'
      )
      .style.display =
      'block';


    return;

  }


  document
    .getElementById(
      'empty'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'block';


  lignes.forEach(
    function(row) {

      const tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML = `

        <td>
          <strong>
            ${echapperHTML(row.matricule)}
          </strong>
        </td>

        <td>
          <strong>
            ${echapperHTML(row.nom)}
          </strong>
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.droit)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.fraisGeneraux)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.fram)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.teeShirt)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.cravate)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.short)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.extra)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.septembre)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.octobre)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.novembre)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.decembre)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.janvier)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.fevrier)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.mars)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.avril)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.mai)
          )}
        </td>

        <td>
          ${echapperHTML(
            formatMontant(row.juin)
          )}
        </td>

        <td>
          ${echapperHTML(
            row.etablissement
          )}
        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );

}


/************************************************************
 * LOADING
 ************************************************************/

function afficherLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'empty'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';

}


/************************************************************
 * ERREUR
 ************************************************************/

function afficherErreur(
  erreur
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  alert(
    'Erreur : ' +
    (
      erreur.message ||
      erreur
    )
  );

}


/************************************************************
 * RETOUR
 ************************************************************/

function retourIndex() {

  window.location.href =
    './index.html';

}

</script>

</body>

</html>
