<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Paiements par classe</title>

<style>

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#fdf2f5,#f8fafc,#fff7ed);
  color:#1e293b;
  min-height:100vh;
  padding:20px;
}

.container {
  max-width:1500px;
  margin:auto;
}

.header {
  background:linear-gradient(135deg,#5b0b20,#8f1d3e,#b8325a);
  color:white;
  padding:20px 25px;
  border-radius:17px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  box-shadow:0 12px 30px rgba(107,16,38,.22);
}

.header h1 {
  font-size:24px;
}

.header p {
  font-size:13px;
  opacity:.85;
  margin-top:4px;
}

.btn {
  border:none;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:600;
}

.btn-back {
  background:rgba(255,255,255,.16);
  color:white;
}

.card {
  background:rgba(255,255,255,.94);
  padding:20px;
  border-radius:15px;
  border:1px solid #f1dce3;
  box-shadow:0 5px 18px rgba(15,23,42,.07);
  margin-bottom:16px;
}

.filters {
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:13px;
  align-items:end;
}

.form-group {
  display:flex;
  flex-direction:column;
}

label {
  font-size:12px;
  font-weight:600;
  color:#475569;
  margin-bottom:6px;
}

select {
  height:42px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  background:#f8fafc;
  padding:0 12px;
  outline:none;
}

select:focus {
  border-color:#8f1d3e;
  background:white;
}

.btn-search {
  height:42px;
  background:#8f1d3e;
  color:white;
}

.table-wrapper {
  overflow:auto;
  border-radius:10px;
}

table {
  width:100%;
  border-collapse:collapse;
  min-width:1450px;
}

th {
  background:#651029;
  color:white;
  padding:11px 9px;
  font-size:11px;
  text-align:left;
  white-space:nowrap;
}

td {
  padding:9px;
  border-bottom:1px solid #edf0f3;
  font-size:11px;
  white-space:nowrap;
}

tr:nth-child(even) td {
  background:#fff8fa;
}

.amount {
  text-align:right;
}

.empty,
.loading {
  display:none;
  text-align:center;
  padding:30px;
  color:#64748b;
}

@media(max-width:750px) {

  .header {
    flex-direction:column;
    align-items:flex-start;
  }

  .filters {
    grid-template-columns:1fr;
  }

  .btn-search {
    width:100%;
  }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

  <div>

    <h1>Paiements par classe</h1>

    <p>
      Consultation directe des données Google Sheets
    </p>

  </div>


  <button
    class="btn btn-back"
    onclick="retourIndex()">

    ← Retour à l'accueil

  </button>

</div>


<div class="card">

  <div class="filters">

    <div class="form-group">

      <label>Classe</label>

      <select id="classe">

        <option value="">
          Sélectionner une classe
        </option>

        <option>PS</option>
        <option>MS</option>
        <option>12</option>
        <option>11</option>
        <option>10</option>
        <option>9</option>
        <option>8</option>
        <option>7</option>
        <option>6</option>
        <option>5</option>
        <option>4</option>
        <option>3</option>
        <option>2</option>
        <option>1</option>
        <option>Tle</option>

      </select>

    </div>


    <div class="form-group">

      <label>Établissement</label>

      <select id="etablissement">

        <option value="">
          Tous les établissements
        </option>

        <option>LS1</option>
        <option>LS2</option>
        <option>LS3</option>

      </select>

    </div>


    <button
      class="btn btn-search"
      onclick="rechercher()">

      🔎 Chercher

    </button>

  </div>

</div>


<div
  class="card loading"
  id="loading">

  ⏳ Chargement des données Google Sheets...

</div>


<div
  class="card empty"
  id="empty">

  Aucun étudiant trouvé.

</div>


<div
  class="card"
  id="tableContainer"
  style="display:none">

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>Matricule</th>
          <th>Nom</th>
          <th>Droit</th>
          <th>Frais généraux</th>
          <th>FRAM</th>
          <th>Tee-shirt</th>
          <th>Cravate</th>
          <th>Short</th>
          <th>Extra</th>

          <th>Septembre</th>
          <th>Octobre</th>
          <th>Novembre</th>
          <th>Décembre</th>
          <th>Janvier</th>
          <th>Février</th>
          <th>Mars</th>
          <th>Avril</th>
          <th>Mai</th>
          <th>Juin</th>

          <th>Établissement</th>

        </tr>

      </thead>

      <tbody id="classeTable"></tbody>

    </table>

  </div>

</div>


</div>


<script>

/************************************************************
 * RECHERCHE
 ************************************************************/

function rechercher() {

  const classe =
    document
      .getElementById(
        'classe'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  if (!classe) {

    alert(
      'Veuillez sélectionner une classe.'
    );

    return;

  }


  afficherLoading();


  google.script.run

    .withSuccessHandler(
      function(resultat) {

        afficherResultats(
          resultat
        );

      }
    )

    .withFailureHandler(
      function(erreur) {

        afficherErreur(
          erreur
        );

      }
    )

    .rechercherClasse(
      classe,
      etablissement
    );

}


/************************************************************
 * FORMAT
 ************************************************************/

function formatMontant(
  valeur
) {

  const montant =
    Number(valeur) || 0;


  if (
    montant === 0
  ) {

    return '';

  }


  return (
    montant.toLocaleString(
      'fr-FR'
    ) +
    ' Ar'
  );

}


function echapperHTML(v) {

  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/************************************************************
 * AFFICHAGE
 ************************************************************/

function afficherResultats(
  lignes
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  const tbody =
    document.getElementById(
      'classeTable'
    );


  tbody.innerHTML =
    '';


  if (
    !lignes ||
    lignes.length === 0
  ) {

    document
      .getElementById(
        'tableContainer'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'empty'
      )
      .style.display =
      'block';


    return;

  }


  document
    .getElementById(
      'empty'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'block';


  lignes.forEach(
    function(row) {

      const tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML = `

        <td>
          <strong>
            ${echapperHTML(row.matricule)}
          </strong>
        </td>

        <td>
          <strong>
            ${echapperHTML(row.nom)}
          </strong>
        </td>

        <td>${formatMontant(row.droit)}</td>

        <td>${formatMontant(row.fraisGeneraux)}</td>

        <td>${formatMontant(row.fram)}</td>

        <td>${formatMontant(row.teeShirt)}</td>

        <td>${formatMontant(row.cravate)}</td>

        <td>${formatMontant(row.short)}</td>

        <td>${formatMontant(row.extra)}</td>

        <td>${formatMontant(row.septembre)}</td>

        <td>${formatMontant(row.octobre)}</td>

        <td>${formatMontant(row.novembre)}</td>

        <td>${formatMontant(row.decembre)}</td>

        <td>${formatMontant(row.janvier)}</td>

        <td>${formatMontant(row.fevrier)}</td>

        <td>${formatMontant(row.mars)}</td>

        <td>${formatMontant(row.avril)}</td>

        <td>${formatMontant(row.mai)}</td>

        <td>${formatMontant(row.juin)}</td>

        <td>
          ${echapperHTML(row.etablissement)}
        </td>

      `;


      tbody.appendChild(tr);

    }
  );

}


/************************************************************
 * LOADING
 ************************************************************/

function afficherLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'empty'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'tableContainer'
    )
    .style.display =
    'none';

}


/************************************************************
 * ERREUR
 ************************************************************/

function afficherErreur(
  erreur
) {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';


  alert(
    'Erreur : ' +
    (
      erreur.message ||
      erreur
    )
  );

}


/************************************************************
 * RETOUR
 ************************************************************/

function retourIndex() {

  window.location.href =
    'index.html';

}

</script>

</body>
</html>
