<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion des paiements</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background:
    linear-gradient(135deg, #fdf2f5, #f8fafc 45%, #fff7ed);
  color: #1e293b;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

.header {
  background:
    linear-gradient(135deg, #5b0b20, #8f1d3e 55%, #b8325a);
  color: white;
  padding: 22px 25px;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 12px 30px rgba(107,16,38,.22);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.header h1 {
  font-size: 25px;
  margin-bottom: 5px;
}

.header p {
  opacity: .85;
  font-size: 13px;
}

.header-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-navigation {
  border: none;
  background: rgba(255,255,255,.15);
  color: white;
  padding: 11px 15px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.btn-navigation:hover {
  background: rgba(255,255,255,.25);
}

.sync-status {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,.12);
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #22c55e;
}

.status-dot.pending {
  background: #f59e0b;
}

.card {
  background: rgba(255,255,255,.92);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 5px 18px rgba(15,23,42,.07);
  border: 1px solid #f1dce3;
}

.card-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
}

.icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: #f9e8ed;
  color: #7f1734;
  display: flex;
  align-items: center;
  justify-content: center;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid #dbe2ea;
  border-radius: 9px;
  background: #f8fafc;
  font-size: 13px;
  outline: none;
}

input:focus,
select:focus {
  background: white;
  border-color: #8f1d3e;
  box-shadow: 0 0 0 3px rgba(143,29,62,.10);
}

.frais-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.money-input {
  position: relative;
}

.money-input input {
  padding-right: 35px;
}

.money-input span {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 11px;
}

.ecolage-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toggle-container {
  display: flex;
  align-items: center;
  gap: 10px;
}

.switch {
  position: relative;
  width: 48px;
  height: 25px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: #cbd5e1;
  border-radius: 30px;
  transition: .25s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 19px;
  height: 19px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: .25s;
}

.switch input:checked + .slider {
  background: #8f1d3e;
}

.switch input:checked + .slider:before {
  transform: translateX(23px);
}

.toggle-text {
  font-weight: 700;
  font-size: 13px;
  color: #64748b;
}

.toggle-text.active {
  color: #8f1d3e;
}

.ecolage-fields {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
  padding-top: 15px;
}

.ecolage-fields.visible {
  display: grid;
}

.total-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #171923, #35101d);
  color: white;
  padding: 17px 20px;
  border-radius: 14px;
  margin-top: 15px;
}

.total-label {
  font-size: 12px;
  color: #cbd5e1;
}

.total-value {
  font-size: 24px;
  font-weight: 700;
}

.currency {
  font-size: 13px;
  color: #94a3b8;
}

.btn-submit {
  width: 100%;
  height: 48px;
  margin-top: 15px;
  border: none;
  border-radius: 11px;
  background: linear-gradient(135deg,#7f1734,#a5264e);
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.btn-submit:disabled {
  opacity: .6;
  cursor: wait;
}

.message {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  font-size: 13px;
}

.message.success {
  display: block;
  background: #ecfdf5;
  color: #047857;
}

.message.error {
  display: block;
  background: #fef2f2;
  color: #b91c1c;
}

@media(max-width:850px) {
  .form-grid {
    grid-template-columns: repeat(2,1fr);
  }

  .frais-grid {
    grid-template-columns: repeat(2,1fr);
  }
}

@media(max-width:600px) {
  body {
    padding: 12px;
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
  }

  .header-actions {
    width: 100%;
  }

  .btn-navigation {
    flex: 1;
  }

  .form-grid,
  .frais-grid,
  .ecolage-fields {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<div class="container">

<div class="header">

  <div>
    <h1>Gestion des paiements</h1>
    <p>Enregistrement d'un nouveau paiement</p>
  </div>

  <div class="header-actions">

    <div class="sync-status">

      <span
        class="status-dot"
        id="statusDot">
      </span>

      <span id="statusText">
        Synchronisé
      </span>

    </div>

    <button
      class="btn-navigation"
      onclick="synchroniserManuellement()">

      🔄 Synchroniser

    </button>

    <button
      class="btn-navigation"
      onclick="ouvrirPaiements()">

      💳 Consultation

    </button>

  </div>

</div>


<div class="card">

  <div class="card-title">

    <div class="icon">👤</div>

    Informations de l'étudiant

  </div>


  <div class="form-grid">

    <div class="form-group">

      <label>Nom *</label>

      <input
        type="text"
        id="nom"
        placeholder="Nom">

    </div>


    <div class="form-group">

      <label>Classe *</label>

      <select id="classe">

        <option value="">
          Sélectionner
        </option>

        <option>PS</option>
        <option>MS</option>
        <option>12</option>
        <option>11</option>
        <option>10</option>
        <option>9</option>
        <option>8</option>
        <option>7</option>
        <option>6</option>
        <option>5</option>
        <option>4</option>
        <option>3</option>
        <option>2</option>
        <option>1</option>
        <option>Tle</option>

      </select>

    </div>


    <div class="form-group">

      <label>Établissement *</label>

      <select id="etablissement">

        <option value="">
          Sélectionner
        </option>

        <option>LS1</option>
        <option>LS2</option>
        <option>LS3</option>

      </select>

    </div>

  </div>

</div>


<div class="card">

  <div class="card-title">

    <div class="icon">💰</div>

    Frais à payer

  </div>


  <div class="frais-grid">

    <div class="form-group">
      <label>Droit</label>
      <div class="money-input">
        <input type="number" id="droit" min="0" placeholder="0">
        <span>Ar</span>
      </div>
    </div>

    <div class="form-group">
      <label>Frais généraux</label>
      <div class="money-input">
        <input type="number" id="fraisGeneraux" min="0" placeholder="0">
        <span>Ar</span>
      </div>
    </div>

    <div class="form-group">
      <label>FRAM</label>
      <div class="money-input">
        <input type="number" id="fram" min="0" placeholder="0">
        <span>Ar</span>
      </div>
    </div>

    <div class="form-group">
      <label>Tee-shirt</label>
      <div class="money-input">
        <input type="number" id="teeShirt" min="0" placeholder="0">
        <span>Ar</span>
      </div>
    </div>

    <div class="form-group">
      <label>Cravate</label>
      <div class="money-input">
        <input type="number" id="cravate" min="0" placeholder="0">
        <span>Ar</span>
      </div>
    </div>

    <div class="form-group">
      <label>Short</label>
      <div class="money-input">
        <input type="number" id="short" min="0" placeholder="0">
        <span>Ar</span>
      </div>
    </div>

    <div class="form-group">
      <label>Extra</label>
      <div class="money-input">
        <input type="number" id="extra" min="0" placeholder="0">
        <span>Ar</span>
      </div>
    </div>

  </div>

</div>


<div class="card">

  <div class="ecolage-header">

    <div class="card-title" style="margin-bottom:0">

      <div class="icon">📚</div>

      Écolage

    </div>


    <div class="toggle-container">

      <span
        class="toggle-text"
        id="toggleText">

        Non

      </span>

      <label class="switch">

        <input
          type="checkbox"
          id="ecolageToggle"
          onchange="gererEcolage()">

        <span class="slider"></span>

      </label>

    </div>

  </div>


  <div
    class="ecolage-fields"
    id="ecolageFields">

    <div class="form-group">

      <label>Montant mensuel</label>

      <div class="money-input">

        <input
          type="number"
          id="montantEcolage"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>


    <div class="form-group">

      <label>Nombre de mois</label>

      <input
        type="number"
        id="nombreMois"
        min="1"
        max="10"
        placeholder="Ex : 2">

    </div>

  </div>

</div>


<div class="total-box">

  <div>

    <div class="total-label">
      Montant total du paiement
    </div>

    <div class="total-value">

      <span id="total">0</span>

      <span class="currency">Ar</span>

    </div>

  </div>

  <div>💰</div>

</div>


<button
  class="btn-submit"
  id="btnSubmit"
  onclick="enregistrer()">

  ✓ Enregistrer le paiement

</button>


<div
  class="message"
  id="message">
</div>

</div>


<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 3;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * INDEXED DB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve,reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath:'id',
                autoIncrement:true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SAUVEGARDE LOCALE
 ************************************************************/

async function sauvegarderPaiementLocal(data) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve,reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .add({

          data:data,

          dateCreation:
            new Date().toISOString(),

          synchronise:false

        });


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * NOMBRE LOCAL
 ************************************************************/

async function nombrePaiementsLocaux() {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve,reject) {

      const request =
        db
          .transaction(
            STORE_PAIEMENTS,
            'readonly'
          )
          .objectStore(
            STORE_PAIEMENTS
          )
          .count();


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * STATUT
 ************************************************************/

async function actualiserStatut() {

  try {

    const nombre =
      await nombrePaiementsLocaux();


    const dot =
      document.getElementById(
        'statusDot'
      );

    const text =
      document.getElementById(
        'statusText'
      );


    if (nombre > 0) {

      dot.classList.add(
        'pending'
      );

      text.textContent =
        nombre +
        ' paiement' +
        (nombre > 1 ? 's' : '') +
        ' non synchronisé' +
        (nombre > 1 ? 's' : '');

    } else {

      dot.classList.remove(
        'pending'
      );

      text.textContent =
        'Synchronisé';

    }

  } catch(e) {}

}


/************************************************************
 * SYNCHRONISATION
 ************************************************************/

async function synchroniserManuellement() {

  if (!navigator.onLine) {

    alert(
      'Aucune connexion Internet.\n\n' +
      'Les paiements restent enregistrés localement.'
    );

    return;

  }


  try {

    const db =
      await ouvrirDB();


    const paiements =
      await new Promise(
        function(resolve,reject) {

          const request =
            db
              .transaction(
                STORE_PAIEMENTS,
                'readonly'
              )
              .objectStore(
                STORE_PAIEMENTS
              )
              .getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );


    if (
      paiements.length === 0
    ) {

      alert(
        'Aucune donnée locale à synchroniser.\n\n' +
        'Vous êtes déjà synchronisé.'
      );

      actualiserStatut();

      return;

    }


    let synchronises = 0;


    for (
      const element of paiements
    ) {

      try {

        await new Promise(
          function(resolve,reject) {

            google.script.run

              .withSuccessHandler(
                function(resultat) {

                  if (
                    resultat &&
                    resultat.success
                  ) {

                    supprimerPaiementLocal(
                      element.id
                    )
                    .then(
                      function() {

                        synchronises++;

                        resolve();

                      }
                    )
                    .catch(reject);

                  } else {

                    reject(
                      new Error(
                        'Échec de synchronisation.'
                      )
                    );

                  }

                }
              )

              .withFailureHandler(
                reject
              )

              .enregistrerPaiement(
                element.data
              );

          }
        );


      } catch(erreur) {

        break;

      }

    }


    await actualiserStatut();


    if (
      synchronises ===
      paiements.length
    ) {

      alert(
        'Synchronisation terminée avec succès.'
      );

    } else {

      alert(
        synchronises +
        ' paiement(s) synchronisé(s).\n\n' +
        'Certains paiements restent encore en local.'
      );

    }


  } catch(erreur) {

    alert(
      'Erreur de synchronisation : ' +
      erreur.message
    );

  }

}


/************************************************************
 * SUPPRESSION LOCALE
 ************************************************************/

async function supprimerPaiementLocal(id) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve,reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .delete(id);


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * ENREGISTREMENT
 ************************************************************/

async function enregistrer() {

  cacherMessage();


  const nom =
    document
      .getElementById('nom')
      .value
      .trim();


  const classe =
    document
      .getElementById('classe')
      .value;


  const etablissement =
    document
      .getElementById('etablissement')
      .value;


  if (
    !nom ||
    !classe ||
    !etablissement
  ) {

    afficherMessage(
      'Veuillez remplir le nom, la classe et l’établissement.',
      'error'
    );

    return;

  }


  const ecolage =
    document
      .getElementById(
        'ecolageToggle'
      )
      .checked;


  const valeur =
    function(id) {

      return Number(
        document
          .getElementById(id)
          .value
      ) || 0;

    };


  const total =

    valeur('droit') +

    valeur('fraisGeneraux') +

    valeur('fram') +

    valeur('teeShirt') +

    valeur('cravate') +

    valeur('short') +

    valeur('extra') +

    (
      ecolage
        ? valeur('montantEcolage') *
          valeur('nombreMois')
        : 0
    );


  if (total <= 0) {

    afficherMessage(
      'Veuillez renseigner au moins un montant.',
      'error'
    );

    return;

  }


  if (
    ecolage &&
    (
      valeur('montantEcolage') <= 0 ||
      valeur('nombreMois') <= 0
    )
  ) {

    afficherMessage(
      'Veuillez renseigner le montant mensuel et le nombre de mois.',
      'error'
    );

    return;

  }


  const data = {

    nom:
      nom,

    classe:
      classe,

    etablissement:
      etablissement,

    droit:
      valeur('droit'),

    fraisGeneraux:
      valeur('fraisGeneraux'),

    fram:
      valeur('fram'),

    teeShirt:
      valeur('teeShirt'),

    cravate:
      valeur('cravate'),

    short:
      valeur('short'),

    extra:
      valeur('extra'),

    ecolage:
      ecolage,

    montantEcolage:
      valeur('montantEcolage'),

    nombreMois:
      valeur('nombreMois')

  };


  const bouton =
    document.getElementById(
      'btnSubmit'
    );


  bouton.disabled =
    true;

  bouton.textContent =
    '⏳ Enregistrement...';


  try {

    /*
     * Toujours local d'abord.
     */

    await sauvegarderPaiementLocal(
      data
    );


    afficherMessage(
      'Paiement enregistré localement. Il sera envoyé lors de la synchronisation.',
      'success'
    );


    reinitialiserFormulaire();


    await actualiserStatut();


  } catch(erreur) {

    afficherMessage(
      'Impossible d’enregistrer localement : ' +
      erreur.message,
      'error'
    );

  }


  bouton.disabled =
    false;

  bouton.textContent =
    '✓ Enregistrer le paiement';

}


/************************************************************
 * ECOLAGE
 ************************************************************/

function gererEcolage() {

  const toggle =
    document.getElementById(
      'ecolageToggle'
    );


  const fields =
    document.getElementById(
      'ecolageFields'
    );


  const text =
    document.getElementById(
      'toggleText'
    );


  if (toggle.checked) {

    fields.classList.add(
      'visible'
    );

    text.textContent =
      'Oui';

    text.classList.add(
      'active'
    );

  } else {

    fields.classList.remove(
      'visible'
    );

    text.textContent =
      'Non';

    text.classList.remove(
      'active'
    );

  }


  calculerTotal();

}


/************************************************************
 * TOTAL
 ************************************************************/

function calculerTotal() {

  const valeur =
    function(id) {

      return Number(
        document
          .getElementById(id)
          .value
      ) || 0;

    };


  let total =

    valeur('droit') +

    valeur('fraisGeneraux') +

    valeur('fram') +

    valeur('teeShirt') +

    valeur('cravate') +

    valeur('short') +

    valeur('extra');


  if (
    document
      .getElementById(
        'ecolageToggle'
      )
      .checked
  ) {

    total +=
      valeur('montantEcolage') *
      valeur('nombreMois');

  }


  document
    .getElementById('total')
    .textContent =
    total.toLocaleString('fr-FR');

}


document
  .querySelectorAll(
    'input[type="number"]'
  )
  .forEach(
    function(input) {

      input.addEventListener(
        'input',
        calculerTotal
      );

    }
  );


/************************************************************
 * REINITIALISATION
 ************************************************************/

function reinitialiserFormulaire() {

  [
    'nom',
    'droit',
    'fraisGeneraux',
    'fram',
    'teeShirt',
    'cravate',
    'short',
    'extra',
    'montantEcolage',
    'nombreMois'
  ].forEach(
    function(id) {

      document
        .getElementById(id)
        .value = '';

    }
  );


  document
    .getElementById(
      'classe'
    )
    .value = '';


  document
    .getElementById(
      'etablissement'
    )
    .value = '';


  document
    .getElementById(
      'ecolageToggle'
    )
    .checked = false;


  gererEcolage();

  calculerTotal();

}


/************************************************************
 * MESSAGES
 ************************************************************/

function afficherMessage(
  texte,
  type
) {

  const message =
    document.getElementById(
      'message'
    );


  message.textContent =
    texte;

  message.className =
    'message ' + type;

  message.style.display =
    'block';

}


function cacherMessage() {

  document
    .getElementById(
      'message'
    )
    .style.display =
    'none';

}


/************************************************************
 * NAVIGATION
 ************************************************************/

function ouvrirPaiements() {

  window.location.href =
    'paiements.html';

}


/************************************************************
 * INITIALISATION
 ************************************************************/

calculerTotal();

actualiserStatut();

</script>

</body>
</html>
