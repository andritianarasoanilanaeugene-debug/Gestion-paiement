<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#7f1734"
>

<title>Gestion des paiements</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

.header {
  background: linear-gradient(
    135deg,
    #6b1026,
    #8f1d3e
  );

  color: white;
  padding: 20px 25px;
  border-radius: 16px;
  margin-bottom: 18px;

  box-shadow:
    0 10px 30px
    rgba(107,16,38,0.22);

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.header h1 {
  font-size: 25px;
  margin-bottom: 5px;
}

.header p {
  opacity: .85;
  font-size: 13px;
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.btn-navigation,
.btn-sync {
  border: none;
  color: white;
  padding: 11px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.btn-navigation {
  background: rgba(255,255,255,.16);
}

.btn-sync {
  background: rgba(255,255,255,.24);
}

.btn-navigation:hover,
.btn-sync:hover {
  background: rgba(255,255,255,.32);
}

.sync-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 700;
  margin-top: 6px;
  justify-content: flex-end;
}

.status-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  display: inline-block;
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(255,255,255,.15);
}

.status-dot.pending {
  background: #f59e0b;
}

.status-dot.syncing {
  background: #38bdf8;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;

  box-shadow:
    0 4px 15px
    rgba(15,23,42,.06);

  border: 1px solid #e5e7eb;
}

.card-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
}

.icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: #f9e8ed;
  color: #7f1734;

  display: flex;
  align-items: center;
  justify-content: center;
}

.form-grid {
  display: grid;
  grid-template-columns:
    repeat(4, 1fr);
  gap: 13px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid #dbe2ea;
  border-radius: 9px;
  background: #f8fafc;
  font-size: 13px;
  outline: none;
}

input:focus,
select:focus {
  background: white;
  border-color: #7f1734;
  box-shadow:
    0 0 0 3px
    rgba(127,23,52,.10);
}

.frais-grid {
  display: grid;
  grid-template-columns:
    repeat(5, 1fr);
  gap: 12px;
}

.money-input {
  position: relative;
}

.money-input input {
  padding-right: 35px;
}

.money-input span {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 11px;
}

.ecolage-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.toggle-container {
  display: flex;
  align-items: center;
  gap: 10px;
}

.switch {
  position: relative;
  width: 48px;
  height: 25px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: #cbd5e1;
  border-radius: 30px;
  transition: .25s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 19px;
  height: 19px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: .25s;
  box-shadow:
    0 2px 5px
    rgba(0,0,0,.15);
}

.switch input:checked + .slider {
  background: #7f1734;
}

.switch input:checked + .slider:before {
  transform: translateX(23px);
}

.toggle-text {
  font-weight: 700;
  font-size: 13px;
  color: #64748b;
}

.toggle-text.active {
  color: #7f1734;
}

.ecolage-fields {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
  padding-top: 10px;
}

.ecolage-fields.visible {
  display: grid;
}

.total-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f172a;
  color: white;
  padding: 16px 20px;
  border-radius: 13px;
  margin-top: 15px;
}

.total-label {
  font-size: 12px;
  color: #cbd5e1;
}

.total-value {
  font-size: 24px;
  font-weight: 700;
}

.currency {
  font-size: 13px;
  color: #94a3b8;
}

.btn-submit {
  width: 100%;
  height: 46px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #7f1734;
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.btn-submit:hover {
  background: #641129;
}

.btn-submit:disabled {
  opacity: .6;
  cursor: wait;
}

.message {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 9px;
  font-size: 13px;
}

.message.success {
  display: block;
  background: #ecfdf5;
  color: #047857;
}

.message.error {
  display: block;
  background: #fef2f2;
  color: #b91c1c;
}

@media (max-width: 850px) {

  .form-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .frais-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

}

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
  }

  .header-actions {
    width: 100%;
    justify-content: stretch;
  }

  .btn-navigation,
  .btn-sync {
    flex: 1;
  }

  .form-grid,
  .frais-grid,
  .ecolage-fields {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

  <div>

    <h1>
      Gestion des paiements
    </h1>

    <p>
      Enregistrement d'un nouveau paiement
    </p>

    <div class="sync-status">

      <span
        id="statusDot"
        class="status-dot">
      </span>

      <span id="statusText">
        Synchronisé
      </span>

    </div>

  </div>


  <div class="header-actions">

    <button
      class="btn-sync"
      id="btnSync"
      onclick="synchroniserPaiements()">

      🔄 Synchroniser

    </button>


    <button
      class="btn-navigation"
      onclick="ouvrirPaiements()">

      💳 Consultation des paiements

    </button>

  </div>

</div>


<!-- INFORMATIONS -->

<div class="card">

  <div class="card-title">

    <div class="icon">
      👤
    </div>

  <div class="form-grid">


    <div class="form-group">

    <div class="form-group">

      <label>
        Prénom *
      </label>

      <input
        type="text"
        id="prenom"
        placeholder="Prénom">

    </div>


    <div class="form-group">

      <label>
        Classe *
      </label>

      <select id="classe">

        <option value="">
          Sélectionner
        </option>

        <option>PS</option>
        <option>MS</option>

        <option>11ème</option>
        <option>10ème</option>
        <option>9ème</option>
        <option>8ème</option>
        <option>7ème</option>
        <option>6ème</option>
        <option>5ème</option>
        <option>4ème</option>
        <option>3ème</option>
        <option>2nde</option>
        <option>1ère</option>

    </div>


    <div class="form-group">

      <label>
        Établissement *

</div>


<!-- FRAIS -->

<div class="card">

      💰

  </div>


  <div class="frais-grid">


    <div class="form-group">

        Frais généraux

        <input

          type="number"

          placeholder="0">

        <span>Ar</span>

      </div>

    </div>


    <div class="form-group">

      <label>
        Cravate
      </label>

      <div class="money-input">

        <input
          type="number"
          id="cravate"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>

<!-- ECOLAGE -->

<div class="card">

  <div class="ecolage-header">

    <div class="card-title"
         style="margin-bottom:0;">

      <div class="icon">
        📚
      </div>

      Écolage

    </div>


    <div class="toggle-container">

        id="toggleText">

        Non

      </span>

          id="ecolageToggle"

<!-- TOTAL -->

      Montant total du paiement

        0

</div>

  class="btn-submit"
  id="btnSubmit"
  onclick="enregistrer()">

  ✓ Enregistrer le paiement

</button>

  id="message">

<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzocTzSSVaTc7ThJQTrMdE4wjYg5yXrq58A5_KboS6kPXHD0mGEzh7GT7Jy7DOqOEiI/exec';


const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 2;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * SERVICE WORKER
 ************************************************************/

if (
  'serviceWorker' in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register(
          './service-worker.js'
        )
        .catch(
          function(erreur) {

            console.error(
              'Service Worker :',
              erreur
            );

          }
        );

    }
  );

}


/************************************************************
 * INDEXEDDB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath: 'id'
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * ID UNIQUE
 ************************************************************/

function creerIdLocal() {

  if (
    crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2)
  );

}


/************************************************************
 * SAUVEGARDE LOCALE
 ************************************************************/

async function sauvegarderPaiementLocal(
  data
) {

  const db =
    await ouvrirDB();


  const element = {

    id:
      creerIdLocal(),

    data:
      data,

    dateCreation:
      new Date().toISOString()

  };


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .add(
          element
        );


      transaction.oncomplete =
        function() {

          resolve(
            element
          );

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * RECUPERATION LOCAL
 ************************************************************/

async function obtenirPaiementsLocaux() {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readonly'
        );


      const request =
        transaction
          .objectStore(
            STORE_PAIEMENTS
          )
          .getAll();


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SUPPRESSION LOCAL
 ************************************************************/

async function supprimerPaiementLocal(
  id
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .delete(
          id
        );


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * ENREGISTREMENT
 *
 * TOUJOURS LOCAL.
 *
 * Aucun appel Internet ici.
 ************************************************************/

async function enregistrer() {

  cacherMessage();


  const matricule =
    document
      .getElementById(
        'matricule'
      )
      .value.trim();


  const nom =
    document
      .getElementById(
        'nom'
      )
      .value.trim();


  const prenom =
    document
      .getElementById(
        'prenom'
      )
      .value.trim();


  const classe =
    document
      .getElementById(
        'classe'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  const ecolage =
    document
      .getElementById(
        'ecolageToggle'
      )
      .checked;


  if (
    !matricule ||
    !nom ||
    !prenom ||
    !classe ||
    !etablissement
  ) {

    afficherMessage(
      'Veuillez remplir toutes les informations obligatoires.',
      'error'
    );

    return;

  }


  const fraisGeneraux =
    valeur(
      'fraisGeneraux'
    );


  const droit =
    valeur(
      'droit'
    );


  const cravate =
    valeur(
      'cravate'
    );


  const teeShirt =
    valeur(
      'teeShirt'
    );


  const extra =
    valeur(
      'extra'
    );


  const montantEcolage =
    valeur(
      'montantEcolage'
    );


  const nombreMois =
    valeur(
      'nombreMois'
    );


  if (
    ecolage &&
    montantEcolage <= 0
  ) {

    afficherMessage(
      'Veuillez renseigner le montant mensuel de l’écolage.',
      'error'
    );

    return;

  }


  if (
    ecolage &&
    (
      nombreMois <= 0 ||
      nombreMois > 10
    )
  ) {

    afficherMessage(
      'Le nombre de mois doit être compris entre 1 et 10.',
      'error'
    );

    return;

  }


  const total =
    fraisGeneraux +
    droit +
    cravate +
    teeShirt +
    extra +
    (
      ecolage
        ? montantEcolage *
          nombreMois
        : 0
    );


  if (
    total <= 0
  ) {

    afficherMessage(
      'Veuillez renseigner au moins un montant.',
      'error'
    );

    return;

  }


  const data = {

    matricule:
      matricule,

    nom:
      nom,

    prenom:
      prenom,

    classe:
      classe,

    etablissement:
      etablissement,

    fraisGeneraux:
      fraisGeneraux,

    droit:
      droit,

    cravate:
      cravate,

    teeShirt:
      teeShirt,

    extra:
      extra,

    ecolage:
      ecolage,

    montantEcolage:
      montantEcolage,

    nombreMois:
      nombreMois

  };


  const bouton =
    document
      .getElementById(
        'btnSubmit'
      );


  bouton.disabled =
    true;

  bouton.textContent =
    '⏳ Enregistrement local...';


  try {

    await sauvegarderPaiementLocal(
      data
    );


    afficherMessage(
      'Paiement enregistré localement. Il sera envoyé à Google Sheets lorsque vous appuierez sur Synchroniser.',
      'success'
    );


    nettoyerFormulaire();


    await actualiserEtatSynchronisation();


  } catch (erreur) {

    afficherMessage(
      'Impossible d’enregistrer localement : ' +
      (
        erreur.message ||
        erreur
      ),
      'error'
    );

  }


  bouton.disabled =
    false;

  bouton.textContent =
    '✓ Enregistrer le paiement';

}


/************************************************************
 * SYNCHRONISATION
 ************************************************************/

async function synchroniserPaiements() {

  const paiements =
    await obtenirPaiementsLocaux();


  if (
    paiements.length === 0
  ) {

    afficherMessage(
      'Aucune donnée locale à synchroniser. Vous êtes déjà synchronisé.',
      'success'
    );

    await actualiserEtatSynchronisation();

    return;

  }


  if (
    !navigator.onLine
  ) {

    afficherMessage(
      'Aucune connexion Internet. Les données restent sur cet appareil.',
      'error'
    );

    return;

  }


  const bouton =
    document
      .getElementById(
        'btnSync'
      );


  bouton.disabled =
    true;

  bouton.textContent =
    '⏳ Synchronisation...';


  afficherEtat(
    'syncing',
    'Synchronisation en cours...'
  );


  let synchronises = 0;


  try {

    for (
      const element
      of paiements
    ) {

      const resultat =
        await envoyerVersServeur(
          element
        );


      if (
        resultat.success
      ) {

        await supprimerPaiementLocal(
          element.id
        );

        synchronises++;

      } else {

        throw new Error(
          resultat.message ||
          'Le serveur a refusé le paiement.'
        );

      }

    }


    afficherMessage(
      synchronises +
      ' paiement(s) synchronisé(s) avec succès.',
      'success'
    );


  } catch (erreur) {

    afficherMessage(
      synchronises +
      ' paiement(s) synchronisé(s).\n\n' +
      'La synchronisation s’est arrêtée : ' +
      (
        erreur.message ||
        erreur
      ),
      'error'
    );

  }


  bouton.disabled =
    false;

  bouton.textContent =
    '🔄 Synchroniser';


  await actualiserEtatSynchronisation();

}


/************************************************************
 * ENVOI SERVEUR
 ************************************************************/

async function envoyerVersServeur(
  element
) {

  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {

        method: 'POST',

        redirect: 'follow',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              'synchroniserPaiement',

            localId:
              element.id,

            data:
              element.data

          })

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      'Erreur HTTP ' +
      response.status
    );

  }


  const resultat =
    await response.json();


  return resultat;

}


/************************************************************
 * ETAT SYNCHRONISATION
 ************************************************************/

async function actualiserEtatSynchronisation() {

  const paiements =
    await obtenirPaiementsLocaux();


  if (
    paiements.length === 0
  ) {

    afficherEtat(
      'synced',
      'Synchronisé'
    );

  } else {

    afficherEtat(
      'pending',
      paiements.length +
      ' paiement(s) en attente'
    );

  }

}


function afficherEtat(
  type,
  texte
) {

  const dot =
    document
      .getElementById(
        'statusDot'
      );


  const status =
    document
      .getElementById(
        'statusText'
      );


  dot.className =
    'status-dot';


  if (
    type === 'pending'
  ) {

    dot.classList.add(
      'pending'
    );

  }


  if (
    type === 'syncing'
  ) {

    dot.classList.add(
      'syncing'
    );

  }


  status.textContent =
    texte;

}


/************************************************************
 * TOTAL
 ************************************************************/

function valeur(
  id
) {

  return Number(
    document
      .getElementById(
        id
      )
      .value
  ) || 0;

}


function calculerTotal() {

  let total = 0;


  total += valeur(
    'fraisGeneraux'
  );

  total += valeur(
    'droit'
  );

  total += valeur(
    'cravate'
  );

  total += valeur(
    'teeShirt'
  );

  total += valeur(
    'extra'
  );


  const ecolage =
    document
      .getElementById(
        'ecolageToggle'
      )
      .checked;


  if (
    ecolage
  ) {

    total +=
      valeur(
        'montantEcolage'
      )
      *
      valeur(
        'nombreMois'
      );

  }


  document
    .getElementById(
      'total'
    )
    .textContent =
    total.toLocaleString(
      'fr-FR'
    );

}


/************************************************************
 * ECOLAGE
 ************************************************************/

function gererEcolage() {

  const toggle =
    document
      .getElementById(
        'ecolageToggle'
      );


  const fields =
    document
      .getElementById(
        'ecolageFields'
      );


  const text =
    document
      .getElementById(
        'toggleText'
      );


  if (
    toggle.checked
  ) {

    fields.classList.add(
      'visible'
    );

    text.textContent =
      'Oui';

    text.classList.add(
      'active'
    );

  } else {

    fields.classList.remove(
      'visible'
    );

    text.textContent =
      'Non';

    text.classList.remove(
      'active'
    );

  }


  calculerTotal();

}


/************************************************************
 * NETTOYAGE
 ************************************************************/

function nettoyerFormulaire() {

  [
    'matricule',
    'nom',
    'prenom',
    'fraisGeneraux',
    'droit',
    'cravate',
    'teeShirt',
    'extra',
    'montantEcolage',
    'nombreMois'
  ]
  .forEach(
    function(id) {

      document
        .getElementById(
          id
        )
        .value = '';

    }
  );


  document
    .getElementById(
      'classe'
    )
    .value = '';


  document
    .getElementById(
      'etablissement'
    )
    .value = '';


  document
    .getElementById(
      'ecolageToggle'
    )
    .checked = false;


  gererEcolage();

  calculerTotal();

}


/************************************************************
 * NAVIGATION
 ************************************************************/

function ouvrirPaiements() {

  window.location.href =
    'paiements.html';

}


/************************************************************
 * MESSAGES
 ************************************************************/

function afficherMessage(
  texte,
  type
) {

  const message =
    document
      .getElementById(
        'message'
      );


  message.textContent =
    texte;


  message.className =
    'message ' +
    type;


  message.style.display =
    'block';

}


function cacherMessage() {

  const message =
    document
      .getElementById(
        'message'
      );


  message.style.display =
    'none';

}


/************************************************************
 * RECALCUL
 ************************************************************/

document
  .querySelectorAll(
    'input[type="number"]'
  )
  .forEach(
    function(input) {

      input.addEventListener(
        'input',
        calculerTotal
      );

    }
  );


/************************************************************
 * DEMARRAGE
 ************************************************************/

window.addEventListener(
  'load',
  function() {

    calculerTotal();

    actualiserEtatSynchronisation();

  }
);

</script>
