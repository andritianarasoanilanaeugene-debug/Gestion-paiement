<script>

/************************************************************
 * URL GOOGLE APPS SCRIPT
 ************************************************************/

const APPS_SCRIPT_URL =
  'TON_URL_APPS_SCRIPT_ICI';


/************************************************************
 * STOCKAGE LOCAL
 ************************************************************/

const DB_NAME = 'GestionPaiementDB';

const DB_VERSION = 1;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * OUVERTURE INDEXEDDB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath: 'id',
                autoIncrement: true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * AJOUT HORS LIGNE
 ************************************************************/

async function sauvegarderPaiementLocal(
  data
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      const store =
        transaction.objectStore(
          STORE_PAIEMENTS
        );


      store.add({

        data: data,

        dateCreation:
          new Date().toISOString(),

        synchronise: false

      });


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * ENREGISTREMENT
 ************************************************************/

async function envoyerPaiement(
  data
) {

  /*
   * Pas d'Internet
   */

  if (
    !navigator.onLine
  ) {

    await sauvegarderPaiementLocal(
      data
    );


    alert(
      'Pas de connexion Internet.\n\n' +
      'Le paiement a été enregistré ' +
      'sur cet appareil et sera ' +
      'synchronisé automatiquement ' +
      'lorsque la connexion reviendra.'
    );


    return;

  }


  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'enregistrerPaiement',

              data:
                data

            })

        }
      );


    const resultat =
      await response.json();


    if (
      !resultat.success
    ) {

      throw new Error(
        resultat.message
      );

    }


    alert(
      'Paiement enregistré avec succès.'
    );


    /*
     * Ici tu peux remettre
     * le formulaire à zéro.
     */

  } catch (erreur) {

    /*
     * Si le serveur est inaccessible,
     * on sauvegarde localement.
     */

    await sauvegarderPaiementLocal(
      data
    );


    alert(
      'Le serveur est inaccessible.\n\n' +
      'Le paiement a été sauvegardé ' +
      'localement et sera synchronisé ' +
      'plus tard.'
    );

  }

}


/************************************************************
 * SYNCHRONISATION
 ************************************************************/

async function synchroniserPaiements() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  const db =
    await ouvrirDB();


  const paiements =
    await new Promise(
      function(resolve, reject) {

        const transaction =
          db.transaction(
            STORE_PAIEMENTS,
            'readonly'
          );


        const store =
          transaction.objectStore(
            STORE_PAIEMENTS
          );


        const request =
          store.getAll();


        request.onsuccess =
          function() {

            resolve(
              request.result
            );

          };


        request.onerror =
          function() {

            reject(
              request.error
            );

          };

      }
    );


  for (
    const element of paiements
  ) {

    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: 'POST',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              JSON.stringify({

                action:
                  'enregistrerPaiement',

                data:
                  element.data

              })

          }
        );


      const resultat =
        await response.json();


      if (
        resultat.success
      ) {

        await supprimerPaiementLocal(
          element.id
        );

      }

    } catch (erreur) {

      /*
       * On arrête.
       * Le paiement restera local.
       */

      break;

    }

  }

}


/************************************************************
 * SUPPRESSION LOCAL
 ************************************************************/

async function supprimerPaiementLocal(
  id
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .delete(id);


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * RETOUR DE LA CONNEXION
 ************************************************************/

window.addEventListener(
  'online',
  function() {

    synchroniserPaiements();

  }
);


/************************************************************
 * AU CHARGEMENT
 ************************************************************/

window.addEventListener(
  'load',
  function() {

    if (
      navigator.onLine
    ) {

      synchroniserPaiements();

    }

  }
);

 ************************************************************/

</script>
