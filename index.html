<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gestion des paiements</title>

<link
  rel="manifest"
  href="manifest.json"
>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  min-height: 100vh;

  padding: 22px;

  background:
    radial-gradient(
      circle at top left,
      #f9dce5 0,
      #f4edf0 28%,
      #eef2f7 65%,
      #e7ebf2 100%
    );

  color: #252033;

}

.container {

  max-width: 1120px;

  margin: auto;

}


/* HEADER */

.header {

  background:
    linear-gradient(
      135deg,
      #5c0c25,
      #86153b 55%,
      #ad3159
    );

  color: white;

  padding: 24px 28px;

  border-radius: 20px;

  margin-bottom: 18px;

  box-shadow:
    0 15px 35px
    rgba(92,12,37,.25);

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 20px;

}

.header h1 {

  font-size: 27px;

  margin-bottom: 5px;

}

.header p {

  opacity: .85;

  font-size: 13px;

}

.header-buttons {

  display: flex;

  gap: 9px;

  flex-wrap: wrap;

}

.btn-navigation {

  border: none;

  background:
    rgba(255,255,255,.15);

  color: white;

  padding:
    11px 15px;

  border-radius: 11px;

  font-size: 12px;

  font-weight: 700;

  cursor: pointer;

  transition: .2s;

}

.btn-navigation:hover {

  background:
    rgba(255,255,255,.27);

  transform:
    translateY(-2px);

}


/* SYNCHRO */

.sync-card {

  background:
    linear-gradient(
      135deg,
      #fff,
      #fff7f9
    );

  border:
    1px solid #ead6dd;

  border-radius: 17px;

  padding: 15px 18px;

  margin-bottom: 15px;

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 15px;

  box-shadow:
    0 5px 20px
    rgba(80,20,45,.07);

}

.sync-status {

  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 13px;

  font-weight: 700;

}

.status-light {

  width: 13px;

  height: 13px;

  border-radius: 50%;

  background: #16a34a;

  box-shadow:
    0 0 0 5px
    rgba(22,163,74,.12);

}

.status-light.pending {

  background: #f59e0b;

  box-shadow:
    0 0 0 5px
    rgba(245,158,11,.13);

}

.sync-button {

  border: none;

  background:
    linear-gradient(
      135deg,
      #8b173e,
      #bd3864
    );

  color: white;

  padding:
    11px 18px;

  border-radius: 10px;

  font-weight: 700;

  cursor: pointer;

}

.sync-button:disabled {

  opacity: .55;

  cursor: wait;

}


/* CARDS */

.card {

  background:
    rgba(255,255,255,.92);

  border:
    1px solid #eadfe4;

  border-radius: 17px;

  padding: 21px;

  margin-bottom: 15px;

  box-shadow:
    0 6px 22px
    rgba(31,18,30,.06);

}

.card-title {

  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 16px;

  font-weight: 800;

  margin-bottom: 17px;

}

.icon {

  width: 35px;

  height: 35px;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #f7d8e1,
      #f3b9ca
    );

  color: #771331;

  display: flex;

  align-items: center;

  justify-content: center;

}


/* FORM */

.form-grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 14px;

}

.form-group {

  display: flex;

  flex-direction: column;

}

label {

  font-size: 12px;

  font-weight: 700;

  color: #5e5260;

  margin-bottom: 6px;

}

input,
select {

  width: 100%;

  height: 43px;

  padding:
    0 12px;

  border:
    1px solid #ddd3d9;

  border-radius: 10px;

  background: #fcfafb;

  color: #29222d;

  font-size: 13px;

  outline: none;

}

input:focus,
select:focus {

  background: white;

  border-color: #a32650;

  box-shadow:
    0 0 0 3px
    rgba(163,38,80,.11);

}


/* FRAIS */

.frais-grid {

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 12px;

}

.money-input {

  position: relative;

}

.money-input input {

  padding-right: 35px;

}

.money-input span {

  position: absolute;

  right: 10px;

  top: 50%;

  transform:
    translateY(-50%);

  color: #a18d98;

  font-size: 11px;

}


/* ECOLAGE */

.ecolage-header {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

}

.toggle-container {

  display: flex;

  align-items: center;

  gap: 9px;

}

.switch {

  position: relative;

  width: 49px;

  height: 26px;

}

.switch input {

  display: none;

}

.slider {

  position: absolute;

  inset: 0;

  background: #cfc6cb;

  border-radius: 30px;

  cursor: pointer;

  transition: .25s;

}

.slider:before {

  content: "";

  position: absolute;

  width: 20px;

  height: 20px;

  left: 3px;

  top: 3px;

  background: white;

  border-radius: 50%;

  transition: .25s;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.15);

}

.switch input:checked
+ .slider {

  background:
    linear-gradient(
      135deg,
      #86153b,
      #c03c67
    );

}

.switch input:checked
+ .slider:before {

  transform:
    translateX(23px);

}

.toggle-text {

  font-weight: 800;

  font-size: 13px;

  color: #786b74;

}

.toggle-text.active {

  color: #86153b;

}

.ecolage-fields {

  display: none;

  grid-template-columns:
    1fr 1fr;

  gap: 13px;

  padding-top: 16px;

}

.ecolage-fields.visible {

  display: grid;

}


/* TOTAL */

.total-box {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  background:
    linear-gradient(
      135deg,
      #28121d,
      #52172e
    );

  color: white;

  padding:
    18px 21px;

  border-radius: 15px;

  margin-top: 15px;

  box-shadow:
    0 10px 25px
    rgba(67,17,39,.18);

}

.total-label {

  font-size: 12px;

  color: #dfcbd3;

}

.total-value {

  font-size: 25px;

  font-weight: 800;

}

.currency {

  font-size: 13px;

  color: #c6aeb8;

}


/* BUTTON */

.btn-submit {

  width: 100%;

  height: 48px;

  margin-top: 15px;

  border: none;

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      #821438,
      #b72e5c
    );

  color: white;

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 7px 18px
    rgba(130,20,56,.20);

  transition: .2s;

}

.btn-submit:hover {

  transform:
    translateY(-2px);

}

.btn-submit:disabled {

  opacity: .6;

  cursor: wait;

  transform: none;

}


/* MESSAGE */

.message {

  display: none;

  margin-top: 12px;

  padding: 12px;

  border-radius: 10px;

  font-size: 13px;

  font-weight: 600;

}

.message.success {

  display: block;

  background: #e9f9ef;

  color: #08763e;

}

.message.error {

  display: block;

  background: #fff0f2;

  color: #b4234b;

}


/* MOBILE */

@media(max-width:850px) {

  .form-grid {

    grid-template-columns:
      repeat(2,1fr);

  }

  .frais-grid {

    grid-template-columns:
      repeat(2,1fr);

  }

}

@media(max-width:600px) {

  body {

    padding: 12px;

  }

  .header {

    flex-direction: column;

    align-items: flex-start;

  }

  .header-buttons {

    width: 100%;

  }

  .btn-navigation {

    flex: 1;

  }

  .sync-card {

    flex-direction: column;

    align-items: stretch;

  }

  .sync-button {

    width: 100%;

  }

  .form-grid,
  .frais-grid,
  .ecolage-fields {

    grid-template-columns: 1fr;

  }

}

</style>

</head>


<body>

<div class="container">


<div class="header">

  <div>

    <h1>Gestion des paiements</h1>

    <p>
      Enregistrement d'un nouveau paiement
    </p>

  </div>


  <div class="header-buttons">

    <button
      class="btn-navigation"
      onclick="ouvrirPaiements()">

      💳 Paiements

    </button>


    <button
      class="btn-navigation"
      onclick="ouvrirClasse()">

      📚 Par classe

    </button>

  </div>

</div>


<!-- SYNCHRONISATION -->

<div class="sync-card">

  <div class="sync-status">

    <span
      id="statusLight"
      class="status-light">
    </span>

    <span id="syncText">
      Synchronisé

    </span>

  </div>


  <button
    class="sync-button"
    id="syncButton"
    onclick="synchroniserPaiements()">

    🔄 Synchroniser

  </button>

</div>


<!-- ETUDIANT -->

<div class="card">

  <div class="card-title">

    <div class="icon">
      👤
    </div>

    Informations de l'étudiant

  </div>


  <div class="form-grid">

    <div class="form-group">

      <label>Matricule *</label>

      <input
        id="matricule"
        type="text"
        placeholder="Ex : 00002">

    </div>


    <div class="form-group">

      <label>Nom *</label>

      <input
        id="nom"
        type="text"
        placeholder="Nom">

    </div>


    <div class="form-group">

      <label>Prénom *</label>

      <input
        id="prenom"
        type="text"
        placeholder="Prénom">

    </div>


    <div class="form-group">

      <label>Classe *</label>

      <select id="classe">

        <option value="">
          Sélectionner
        </option>

        <option>PS</option>
        <option>MS</option>
        <option>11ème</option>
        <option>10ème</option>
        <option>9ème</option>
        <option>8ème</option>
        <option>7ème</option>
        <option>6ème</option>
        <option>5ème</option>
        <option>4ème</option>
        <option>3ème</option>
        <option>2nde</option>
        <option>1ère</option>
        <option>Terminale</option>

      </select>

    </div>


    <div class="form-group">

      <label>Établissement *</label>

      <select id="etablissement">

        <option value="">
          Sélectionner
        </option>

        <option>LS1</option>
        <option>LS2</option>
        <option>LS3</option>

      </select>

    </div>

  </div>

</div>


<!-- FRAIS -->

<div class="card">

  <div class="card-title">

    <div class="icon">
      💰
    </div>

    Frais à payer

  </div>


  <div class="frais-grid">

    <div class="form-group">

      <label>Frais généraux</label>

      <div class="money-input">

        <input
          id="fraisGeneraux"
          type="number"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>


    <div class="form-group">

      <label>Droit</label>

      <div class="money-input">

        <input
          id="droit"
          type="number"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>


    <div class="form-group">

      <label>Cravate</label>

      <div class="money-input">

        <input
          id="cravate"
          type="number"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>


    <div class="form-group">

      <label>Tee-shirt</label>

      <div class="money-input">

        <input
          id="teeShirt"
          type="number"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>


    <div class="form-group">

      <label>Extra</label>

      <div class="money-input">

        <input
          id="extra"
          type="number"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>

  </div>

</div>


<!-- ECOLAGE -->

<div class="card">

  <div class="ecolage-header">

    <div class="card-title"
         style="margin-bottom:0">

      <div class="icon">
        📚
      </div>

      Écolage

    </div>


    <div class="toggle-container">

      <span
        id="toggleText"
        class="toggle-text">

        Non

      </span>


      <label class="switch">

        <input
          type="checkbox"
          id="ecolageToggle"
          onchange="gererEcolage()">

        <span class="slider"></span>

      </label>

    </div>

  </div>


  <div
    id="ecolageFields"
    class="ecolage-fields">

    <div class="form-group">

      <label>Montant mensuel</label>

      <div class="money-input">

        <input
          id="montantEcolage"
          type="number"
          min="0"
          placeholder="0">

        <span>Ar</span>

      </div>

    </div>


    <div class="form-group">

      <label>Nombre de mois</label>

      <input
        id="nombreMois"
        type="number"
        min="1"
        max="10"
        placeholder="Ex : 2">

    </div>

  </div>

</div>


<!-- TOTAL -->

<div class="total-box">

  <div>

    <div class="total-label">
      Montant total du paiement
    </div>

    <div class="total-value">

      <span id="total">
        0
      </span>

      <span class="currency">
        Ar
      </span>

    </div>

  </div>

  <div>💰</div>

</div>


<button
  class="btn-submit"
  id="btnSubmit"
  onclick="enregistrer()">

  ✓ Enregistrer le paiement

</button>


<div
  id="message"
  class="message">
</div>


</div>


<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const APPS_SCRIPT_URL =
  'TON_URL_APPS_SCRIPT_ICI';


/************************************************************
 * INDEXEDDB
 ************************************************************/

const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 1;

const STORE_PAIEMENTS =
  'paiements_en_attente';


function ouvrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath: 'id',
                autoIncrement: true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SAUVEGARDE LOCALE
 ************************************************************/

async function sauvegarderPaiementLocal(
  data
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .add({

          data:
            data,

          dateCreation:
            new Date().toISOString(),

          synchronise:
            false

        });


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * LECTURE LOCALE
 ************************************************************/

async function obtenirPaiementsLocaux() {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const request =
        db
          .transaction(
            STORE_PAIEMENTS,
            'readonly'
          )
          .objectStore(
            STORE_PAIEMENTS
          )
          .getAll();


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SUPPRESSION LOCALE
 ************************************************************/

async function supprimerPaiementLocal(
  id
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .delete(id);


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * ETAT SYNCHRONISATION
 ************************************************************/

async function mettreAJourEtatSynchronisation() {

  const paiements =
    await obtenirPaiementsLocaux();


  const light =
    document.getElementById(
      'statusLight'
    );


  const text =
    document.getElementById(
      'syncText'
    );


  const button =
    document.getElementById(
      'syncButton'
    );


  if (
    paiements.length === 0
  ) {

    light.classList.remove(
      'pending'
    );


    text.textContent =
      'Synchronisé';


    button.textContent =
      '✓ Synchronisé';


  } else {

    light.classList.add(
      'pending'
    );


    text.textContent =
      paiements.length +
      (
        paiements.length > 1
          ? ' paiements à synchroniser'
          : ' paiement à synchroniser'
      );


    button.textContent =
      '🔄 Synchroniser (' +
      paiements.length +
      ')';

  }

}


/************************************************************
 * SYNCHRONISATION MANUELLE
 ************************************************************/

async function synchroniserPaiements() {

  if (
    !navigator.onLine
  ) {

    afficherMessage(
      'Aucune connexion Internet. Impossible de synchroniser.',
      'error'
    );

    return;

  }


  const button =
    document.getElementById(
      'syncButton'
    );


  const paiements =
    await obtenirPaiementsLocaux();


  if (
    paiements.length === 0
  ) {

    afficherMessage(
      'Aucune donnée locale à synchroniser.',
      'success'
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    '⏳ Synchronisation...';


  try {

    for (
      const element of paiements
    ) {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: 'POST',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              JSON.stringify({

                action:
                  'enregistrerPaiement',

                data:
                  element.data

              })

          }
        );


      const resultat =
        await response.json();


      if (
        !resultat.success
      ) {

        throw new Error(
          resultat.message
        );

      }


      await supprimerPaiementLocal(
        element.id
      );

    }


    afficherMessage(
      'Synchronisation terminée avec succès.',
      'success'
    );


  } catch (erreur) {

    afficherMessage(
      'Synchronisation interrompue : ' +
      (
        erreur.message ||
        erreur
      ),
      'error'
    );

  }


  button.disabled = false;


  await mettreAJourEtatSynchronisation();

}


/************************************************************
 * ENREGISTREMENT
 ************************************************************/

async function enregistrer() {

  cacherMessage();


  const data = {

    operationId:
      crypto.randomUUID
        ? crypto.randomUUID()
        : (
            Date.now() +
            '-' +
            Math.random()
              .toString(36)
              .substring(2)
          ),

    matricule:
      document
        .getElementById('matricule')
        .value
        .trim(),

    nom:
      document
        .getElementById('nom')
        .value
        .trim(),

    prenom:
      document
        .getElementById('prenom')
        .value
        .trim(),

    classe:
      document
        .getElementById('classe')
        .value,

    etablissement:
      document
        .getElementById('etablissement')
        .value,

    fraisGeneraux:
      valeur('fraisGeneraux'),

    droit:
      valeur('droit'),

    cravate:
      valeur('cravate'),

    teeShirt:
      valeur('teeShirt'),

    extra:
      valeur('extra'),

    ecolage:
      document
        .getElementById('ecolageToggle')
        .checked,

    montantEcolage:
      valeur('montantEcolage'),

    nombreMois:
      valeur('nombreMois')

  };


  if (
    !data.matricule ||
    !data.nom ||
    !data.prenom ||
    !data.classe ||
    !data.etablissement
  ) {

    afficherMessage(
      'Veuillez remplir toutes les informations obligatoires.',
      'error'
    );

    return;

  }


  if (
    data.ecolage &&
    (
      data.montantEcolage <= 0 ||
      data.nombreMois <= 0
    )
  ) {

    afficherMessage(
      'Veuillez renseigner le montant mensuel et le nombre de mois.',
      'error'
    );

    return;

  }


  const total =
    data.fraisGeneraux
    +
    data.droit
    +
    data.cravate
    +
    data.teeShirt
    +
    data.extra
    +
    (
      data.ecolage
        ? data.montantEcolage *
          data.nombreMois
        : 0
    );


  if (
    total <= 0
  ) {

    afficherMessage(
      'Veuillez renseigner au moins un montant.',
      'error'
    );

    return;

  }


  /*
   * IMPORTANT :
   * on enregistre TOUJOURS localement.
   *
   * Aucun appel réseau ici.
   */

  const bouton =
    document.getElementById(
      'btnSubmit'
    );


  bouton.disabled = true;

  bouton.textContent =
    '⏳ Enregistrement...';


  try {

    await sauvegarderPaiementLocal(
      data
    );


    afficherMessage(
      'Paiement enregistré sur cet appareil. Vous pouvez le synchroniser quand vous le souhaitez.',
      'success'
    );


    nettoyerFormulaire();


    await mettreAJourEtatSynchronisation();


  } catch (erreur) {

    afficherMessage(
      'Impossible d’enregistrer localement : ' +
      (
        erreur.message ||
        erreur
      ),
      'error'
    );

  }


  bouton.disabled = false;

  bouton.textContent =
    '✓ Enregistrer le paiement';

}


/************************************************************
 * VALEUR
 ************************************************************/

function valeur(id) {

  return Number(
    document
      .getElementById(id)
      .value
  ) || 0;

}


/************************************************************
 * ECOLAGE
 ************************************************************/

function gererEcolage() {

  const toggle =
    document.getElementById(
      'ecolageToggle'
    );


  const fields =
    document.getElementById(
      'ecolageFields'
    );


  const text =
    document.getElementById(
      'toggleText'
    );


  if (
    toggle.checked
  ) {

    fields.classList.add(
      'visible'
    );

    text.textContent =
      'Oui';

    text.classList.add(
      'active'
    );

  } else {

    fields.classList.remove(
      'visible'
    );

    text.textContent =
      'Non';

    text.classList.remove(
      'active'
    );

  }


  calculerTotal();

}


/************************************************************
 * TOTAL
 ************************************************************/

function calculerTotal() {

  let total = 0;


  [
    'fraisGeneraux',
    'droit',
    'cravate',
    'teeShirt',
    'extra'
  ].forEach(
    function(id) {

      total +=
        valeur(id);

    }
  );


  if (
    document
      .getElementById(
        'ecolageToggle'
      )
      .checked
  ) {

    total +=
      valeur(
        'montantEcolage'
      )
      *
      valeur(
        'nombreMois'
      );

  }


  document
    .getElementById(
      'total'
    )
    .textContent =
    total.toLocaleString(
      'fr-FR'
    );

}


/************************************************************
 * NETTOYAGE
 ************************************************************/

function nettoyerFormulaire() {

  [
    'matricule',
    'nom',
    'prenom',
    'fraisGeneraux',
    'droit',
    'cravate',
    'teeShirt',
    'extra',
    'montantEcolage',
    'nombreMois'
  ].forEach(
    function(id) {

      document
        .getElementById(id)
        .value = '';

    }
  );


  document
    .getElementById(
      'classe'
    )
    .value = '';


  document
    .getElementById(
      'etablissement'
    )
    .value = '';


  document
    .getElementById(
      'ecolageToggle'
    )
    .checked = false;


  gererEcolage();

  calculerTotal();

}


/************************************************************
 * MESSAGES
 ************************************************************/

function afficherMessage(
  texte,
  type
) {

  const message =
    document.getElementById(
      'message'
    );


  message.textContent =
    texte;


  message.className =
    'message ' +
    type;


  message.style.display =
    'block';

}


function cacherMessage() {

  document
    .getElementById(
      'message'
    )
    .style.display =
    'none';

}


/************************************************************
 * NAVIGATION
 ************************************************************/

function ouvrirPaiements() {

  window.location.href =
    'paiements.html';

}


function ouvrirClasse() {

  window.location.href =
    'classe.html';

}


/************************************************************
 * INITIALISATION
 ************************************************************/

document
  .querySelectorAll(
    'input[type="number"]'
  )
  .forEach(
    function(input) {

      input.addEventListener(
        'input',
        calculerTotal
      );

    }
  );


window.addEventListener(
  'load',
  function() {

    calculerTotal();

    mettreAJourEtatSynchronisation();

  }
);

</script>

</body>

</html>
