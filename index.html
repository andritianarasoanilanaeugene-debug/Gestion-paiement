<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gestion des paiements</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f1f5f9;

  color: #1e293b;

  min-height: 100vh;

  padding: 25px 20px;

}

.container {

  max-width: 900px;

  margin: auto;

}

/* HEADER */

.header {

  background:
    linear-gradient(
      135deg,
      #6b1026,
      #8f1d3e
    );

  color: white;

  padding: 25px;

  border-radius: 16px;

  margin-bottom: 20px;

  box-shadow:
    0 10px 30px
    rgba(107,16,38,0.25);

}

.header h1 {

  font-size: 25px;

  margin-bottom: 5px;

}

.header p {

  opacity: 0.85;

  font-size: 13px;

}


/* STATUT */

.status-card {

  background: white;

  border-radius: 13px;

  padding: 15px 18px;

  margin-bottom: 18px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  border: 1px solid #e5e7eb;

  box-shadow:
    0 4px 15px
    rgba(15,23,42,0.05);

}

.status {

  font-size: 13px;

  font-weight: 600;

}

.status.online {

  color: #15803d;

}

.status.offline {

  color: #dc2626;

}

.status.pending {

  color: #d97706;

}

.btn-sync {

  border: none;

  background: #7f1734;

  color: white;

  padding: 9px 14px;

  border-radius: 8px;

  cursor: pointer;

  font-weight: 600;

  font-size: 12px;

}

.btn-sync:hover {

  background: #641129;

}

.btn-sync:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}


/* CARD */

.card {

  background: white;

  border-radius: 15px;

  padding: 25px;

  margin-bottom: 18px;

  box-shadow:
    0 4px 15px
    rgba(15,23,42,0.06);

  border: 1px solid #e5e7eb;

}

.card-title {

  font-size: 18px;

  font-weight: 700;

  margin-bottom: 20px;

}


/* FORM */

.grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 15px;

}

.form-group {

  display: flex;

  flex-direction: column;

}

.form-group.full {

  grid-column: 1 / -1;

}

label {

  font-size: 12px;

  font-weight: 600;

  color: #475569;

  margin-bottom: 6px;

}

input,
select {

  height: 43px;

  padding: 0 12px;

  border:
    1px solid #dbe2ea;

  border-radius: 9px;

  background: #f8fafc;

  outline: none;

  font-size: 13px;

}

input:focus,
select:focus {

  background: white;

  border-color: #7f1734;

  box-shadow:
    0 0 0 3px
    rgba(127,23,52,0.10);

}


/* MONTANTS */

.amount-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 12px;

  margin-top: 15px;

}

.checkbox {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 15px;

  font-size: 13px;

}

.checkbox input {

  width: auto;

  height: auto;

}


/* BOUTONS */

.buttons {

  display: flex;

  gap: 12px;

  margin-top: 22px;

}

.btn {

  border: none;

  border-radius: 9px;

  padding: 12px 18px;

  cursor: pointer;

  font-size: 13px;

  font-weight: 600;

}

.btn-primary {

  background: #7f1734;

  color: white;

}

.btn-secondary {

  background: #e2e8f0;

  color: #334155;

}

.btn-primary:hover {

  background: #641129;

}


/* MESSAGE */

.message {

  padding: 12px;

  border-radius: 8px;

  margin-top: 15px;

  font-size: 13px;

  display: none;

}

.message.success {

  background: #dcfce7;

  color: #166534;

}

.message.error {

  background: #fee2e2;

  color: #991b1b;

}


/* MOBILE */

@media (
  max-width: 700px
) {

  body {

    padding: 12px;

  }

  .grid,
  .amount-grid {

    grid-template-columns: 1fr;

  }

  .form-group.full {

    grid-column: auto;

  }

  .status-card {

    flex-direction: column;

    align-items: flex-start;

  }

  .btn-sync {

    width: 100%;

  }

  .buttons {

    flex-direction: column;

  }

  .btn {

    width: 100%;

  }

}

</style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>
      Gestion des paiements
    </h1>

    <p>
      Enregistrement des paiements scolaires
    </p>

  </div>


  <!-- STATUT -->

  <div class="status-card">

    <div
      id="statusConnexion"
      class="status online"
    >
      🟢 Connexion vérifiée
    </div>

    <button
      id="btnSynchroniser"
      class="btn-sync"
      onclick="synchroniserPaiements(true)"
    >
      🔄 Synchroniser maintenant
    </button>

  </div>


  <!-- FORMULAIRE -->

  <div class="card">

    <div class="card-title">

      💳 Nouveau paiement

    </div>


    <div class="grid">


      <div class="form-group">

        <label>
          Matricule
        </label>

        <input
          type="text"
          id="matricule"
        >

      </div>


      <div class="form-group">

        <label>
          Nom
        </label>

        <input
          type="text"
          id="nom"
        >

      </div>


      <div class="form-group">

        <label>
          Prénom
        </label>

        <input
          type="text"
          id="prenom"
        >

      </div>


      <div class="form-group">

        <label>
          Classe
        </label>

        <input
          type="text"
          id="classe"
        >

      </div>


      <div class="form-group full">

        <label>
          Établissement
        </label>

        <input
          type="text"
          id="etablissement"
        >

      </div>


    </div>


    <div class="card-title"
         style="margin-top:25px;">

      💰 Montants

    </div>


    <div class="amount-grid">


      <div class="form-group">

        <label>
          Frais généraux
        </label>

        <input
          type="number"
          id="fraisGeneraux"
          min="0"
          value="0"
        >

      </div>


      <div class="form-group">

        <label>
          Droit
        </label>

        <input
          type="number"
          id="droit"
          min="0"
          value="0"
        >

      </div>


      <div class="form-group">

        <label>
          Cravate
        </label>

        <input
          type="number"
          id="cravate"
          min="0"
          value="0"
        >

      </div>


      <div class="form-group">

        <label>
          Tee-shirt
        </label>

        <input
          type="number"
          id="teeShirt"
          min="0"
          value="0"
        >

      </div>


      <div class="form-group">

        <label>
          Extra
        </label>

        <input
          type="number"
          id="extra"
          min="0"
          value="0"
        >

      </div>


    </div>


    <label class="checkbox">

      <input
        type="checkbox"
        id="ecolage"
        onchange="gererEcolage()"
      >

      Écolage

    </label>


    <div
      id="blocEcolage"
      style="display:none; margin-top:15px;"
    >

      <div class="amount-grid">

        <div class="form-group">

          <label>
            Montant mensuel
          </label>

          <input
            type="number"
            id="montantEcolage"
            min="0"
            value="0"
          >

        </div>


        <div class="form-group">

          <label>
            Nombre de mois
          </label>

          <input
            type="number"
            id="nombreMois"
            min="1"
            max="10"
            value="1"
          >

        </div>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div class="buttons">

      <button
        class="btn btn-primary"
        onclick="enregistrer()"
      >
        💾 Enregistrer le paiement
      </button>


      <button
        class="btn btn-secondary"
        onclick="ouvrirPaiements()"
      >
        📋 Consultation des paiements
      </button>

    </div>


  </div>

</div>


<script>

/************************************************************
 * URL GOOGLE APPS SCRIPT
 ************************************************************/

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbwQUcENV5ShGsj7em_nMh1K81gMffTpzY0DMoGI1vQKMBGxP7r3o9t0uHv1-q4xvvv6/exec';


/************************************************************
 * INDEXEDDB
 ************************************************************/

const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION =
  1;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * OUVERTURE DB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath: 'id',
                autoIncrement: true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SAUVEGARDE LOCALE
 ************************************************************/

async function sauvegarderPaiementLocal(
  data
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .add({

          data: data,

          dateCreation:
            new Date().toISOString(),

          synchronise:
            false

        });


      transaction.oncomplete =
        function() {

          resolve();

          mettreAJourStatut();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * RECUPERATION PAIEMENTS LOCAUX
 ************************************************************/

async function recupererPaiementsLocaux() {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readonly'
        );


      const request =
        transaction
          .objectStore(
            STORE_PAIEMENTS
          )
          .getAll();


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SUPPRESSION LOCAL
 ************************************************************/

async function supprimerPaiementLocal(
  id
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .delete(id);


      transaction.oncomplete =
        function() {

          resolve();

        };


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * ENVOI SERVEUR
 ************************************************************/

async function envoyerAuServeur(
  data
) {

  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {

        method: 'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              'enregistrerPaiement',

            data:
              data

          })

      }
    );


  const resultat =
    await response.json();


  if (
    !resultat.success
  ) {

    throw new Error(
      resultat.message
    );

  }


  return resultat;

}


/************************************************************
 * ENREGISTREMENT
 ************************************************************/

async function enregistrer() {

  const data = {

    matricule:
      document
        .getElementById(
          'matricule'
        )
        .value
        .trim(),

    nom:
      document
        .getElementById(
          'nom'
        )
        .value
        .trim(),

    prenom:
      document
        .getElementById(
          'prenom'
        )
        .value
        .trim(),

    classe:
      document
        .getElementById(
          'classe'
        )
        .value
        .trim(),

    etablissement:
      document
        .getElementById(
          'etablissement'
        )
        .value
        .trim(),

    fraisGeneraux:
      document
        .getElementById(
          'fraisGeneraux'
        )
        .value,

    droit:
      document
        .getElementById(
          'droit'
        )
        .value,

    cravate:
      document
        .getElementById(
          'cravate'
        )
        .value,

    teeShirt:
      document
        .getElementById(
          'teeShirt'
        )
        .value,

    extra:
      document
        .getElementById(
          'extra'
        )
        .value,

    ecolage:
      document
        .getElementById(
          'ecolage'
        )
        .checked,

    montantEcolage:
      document
        .getElementById(
          'montantEcolage'
        )
        .value,

    nombreMois:
      document
        .getElementById(
          'nombreMois'
        )
        .value

  };


  /******************************************************
   * VALIDATION LOCALE
   ******************************************************/

  if (!data.matricule) {

    afficherMessage(
      'La matricule est obligatoire.',
      'error'
    );

    return;

  }


  if (!data.nom) {

    afficherMessage(
      'Le nom est obligatoire.',
      'error'
    );

    return;

  }


  if (!data.prenom) {

    afficherMessage(
      'Le prénom est obligatoire.',
      'error'
    );

    return;

  }


  if (!data.classe) {

    afficherMessage(
      'La classe est obligatoire.',
      'error'
    );

    return;

  }


  if (!data.etablissement) {

    afficherMessage(
      'L’établissement est obligatoire.',
      'error'
    );

    return;

  }


  try {

    /****************************************************
     * HORS CONNEXION
     ****************************************************/

    if (
      !navigator.onLine
    ) {

      await sauvegarderPaiementLocal(
        data
      );


      afficherMessage(
        '🔴 Hors connexion : paiement sauvegardé sur cet appareil. Il sera synchronisé automatiquement.',
        'success'
      );


      viderFormulaire();


      return;

    }


    /****************************************************
     * INTERNET
     ****************************************************/

    try {

      await envoyerAuServeur(
        data
      );


      afficherMessage(
        '🟢 Paiement enregistré avec succès.',
        'success'
      );


      viderFormulaire();


      mettreAJourStatut();


    } catch (erreur) {

      /**************************************************
       * SERVEUR INACCESSIBLE
       **************************************************/

      await sauvegarderPaiementLocal(
        data
      );


      afficherMessage(
        '🟠 Serveur inaccessible : paiement sauvegardé localement. Il sera synchronisé plus tard.',
        'success'
      );


      viderFormulaire();

    }


  } catch (erreur) {

    afficherMessage(
      erreur.message ||
      String(erreur),
      'error'
    );

  }

}


/************************************************************
 * SYNCHRONISATION
 ************************************************************/

async function synchroniserPaiements(
  afficherMessageUtilisateur = false
) {

  if (
    !navigator.onLine
  ) {

    mettreAJourStatut();

    if (
      afficherMessageUtilisateur
    ) {

      afficherMessage(
        '🔴 Pas de connexion Internet.',
        'error'
      );

    }

    return;

  }


  const paiements =
    await recupererPaiementsLocaux();


  if (
    paiements.length === 0
  ) {

    mettreAJourStatut();

    if (
      afficherMessageUtilisateur
    ) {

      afficherMessage(
        '🟢 Aucun paiement en attente. Tout est synchronisé.',
        'success'
      );

    }

    return;

  }


  const bouton =
    document
      .getElementById(
        'btnSynchroniser'
      );


  bouton.disabled = true;

  bouton.textContent =
    '⏳ Synchronisation...';


  let nombreSynchronise = 0;


  for (
    const element of paiements
  ) {

    try {

      await envoyerAuServeur(
        element.data
      );


      await supprimerPaiementLocal(
        element.id
      );


      nombreSynchronise++;


    } catch (erreur) {

      /*
       * On arrête.
       * Le paiement reste local.
       */

      break;

    }

  }


  bouton.disabled = false;


  mettreAJourStatut();


  if (
    afficherMessageUtilisateur
  ) {

    if (
      nombreSynchronise ===
      paiements.length
    ) {

      afficherMessage(
        '🟢 Tous les paiements ont été synchronisés.',
        'success'
      );

    } else {

      afficherMessage(
        '🟠 ' +
        nombreSynchronise +
        ' paiement(s) synchronisé(s). Certains restent en attente.',
        'success'
      );

    }

  }

}


/************************************************************
 * NOMBRE PAIEMENTS EN ATTENTE
 ************************************************************/

async function compterPaiementsLocaux() {

  const paiements =
    await recupererPaiementsLocaux();


  return paiements.length;

}


/************************************************************
 * STATUT
 ************************************************************/

async function mettreAJourStatut() {

  const element =
    document
      .getElementById(
        'statusConnexion'
      );


  const bouton =
    document
      .getElementById(
        'btnSynchroniser'
      );


  if (
    !navigator.onLine
  ) {

    element.className =
      'status offline';


    element.textContent =
      '🔴 Hors connexion';


    bouton.disabled =
      true;


    bouton.textContent =
      '🔄 Synchroniser maintenant';


    return;

  }


  const nombre =
    await compterPaiementsLocaux();


  if (
    nombre > 0
  ) {

    element.className =
      'status pending';


    element.textContent =
      '🟠 ' +
      nombre +
      ' paiement(s) en attente';


    bouton.disabled =
      false;


  } else {

    element.className =
      'status online';


    element.textContent =
      '🟢 Synchronisé';


    bouton.disabled =
      false;

  }


  bouton.textContent =
    '🔄 Synchroniser maintenant';

}


/************************************************************
 * CONNEXION INTERNET
 ************************************************************/

window.addEventListener(
  'online',
  async function() {

    mettreAJourStatut();

    await synchroniserPaiements(
      false
    );

  }
);


window.addEventListener(
  'offline',
  function() {

    mettreAJourStatut();

  }
);


/************************************************************
 * ECOLAGE
 ************************************************************/

function gererEcolage() {

  const coche =
    document
      .getElementById(
        'ecolage'
      )
      .checked;


  document
    .getElementById(
      'blocEcolage'
    )
    .style.display =
    coche
      ? 'block'
      : 'none';

}


/************************************************************
 * MESSAGE
 ************************************************************/

function afficherMessage(
  texte,
  type
) {

  const element =
    document
      .getElementById(
        'message'
      );


  element.textContent =
    texte;


  element.className =
    'message ' +
    type;


  element.style.display =
    'block';

}


/************************************************************
 * VIDER FORMULAIRE
 ************************************************************/

function viderFormulaire() {

  document
    .getElementById(
      'matricule'
    )
    .value = '';


  document
    .getElementById(
      'nom'
    )
    .value = '';


  document
    .getElementById(
      'prenom'
    )
    .value = '';


  document
    .getElementById(
      'fraisGeneraux'
    )
    .value = '0';


  document
    .getElementById(
      'droit'
    )
    .value = '0';


  document
    .getElementById(
      'cravate'
    )
    .value = '0';


  document
    .getElementById(
      'teeShirt'
    )
    .value = '0';


  document
    .getElementById(
      'extra'
    )
    .value = '0';


  document
    .getElementById(
      'ecolage'
    )
    .checked = false;


  document
    .getElementById(
      'montantEcolage'
    )
    .value = '0';


  document
    .getElementById(
      'nombreMois'
    )
    .value = '1';


  gererEcolage();

}


/************************************************************
 * OUVRIR PAIEMENTS
 ************************************************************/

function ouvrirPaiements() {

  window.location.href =
    'paiements.html';

}


/************************************************************
 * CHARGEMENT
 ************************************************************/

window.addEventListener(
  'load',
  async function() {

    mettreAJourStatut();


    if (
      navigator.onLine
    ) {

      await synchroniserPaiements(
        false
      );

    }

  }
);

</script>

</body>

</html>
