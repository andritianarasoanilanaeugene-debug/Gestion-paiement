<!DOCTYPE html>
<html lang="fr">

<head>

<meta

<title>Gestion des paiements</title>

<style>

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top left,

}

.container {

}

.header {

  color:white;

  border-radius:18px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

    0 12px 30px

}

.header h1 {

  font-size:25px;

}

.header p {

  font-size:13px;

  opacity:.85;

  margin-top:4px;

}

.header-actions {

  display:flex;

  gap:8px;

  align-items:center;

  flex-wrap:wrap;

}

.btn {

  border:none;

  border-radius:10px;

  padding:11px 15px;

  cursor:pointer;

  font-weight:700;

  transition:.2s;

}

.btn:hover {

  transform:translateY(-1px);

}

.btn-navigation {

  background:
    rgba(255,255,255,.16);

  color:white;

}

.btn-sync {

  background:#fff;

  color:#7f1734;

}

.btn-sync:disabled {

  opacity:.65;

  cursor:wait;

}

.card {

  background:
    rgba(255,255,255,.95);

  padding:20px;

  border-radius:16px;

  border:
    1px solid #ead7df;

  box-shadow:
    0 5px 18px
    rgba(15,23,42,.07);

  margin-bottom:16px;

}

.card-title {

  display:flex;

  align-items:center;

  gap:9px;

  font-size:16px;

  font-weight:700;

  margin-bottom:16px;

}

.icon {

  width:34px;

  height:34px;

  border-radius:10px;

  background:#f9dce6;

  color:#7f1734;

  display:flex;

  align-items:center;

  justify-content:center;

}

.form-grid {

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:13px;

}

.form-group {

  display:flex;

  flex-direction:column;

}

label {

  font-size:12px;

  font-weight:700;

  color:#475569;

  margin-bottom:6px;

}

input,
select {

  width:100%;

  height:42px;

  padding:0 12px;

  border:
    1px solid #dbe2ea;

  border-radius:9px;

  background:#f8fafc;

  font-size:13px;

  outline:none;

}

input:focus,
select:focus {

  background:white;

  border-color:#8f1d3e;

  box-shadow:
    0 0 0 3px
    rgba(143,29,62,.10);

}

/************************************************
 * RECHERCHE ELEVE
 ************************************************/

.search-box {

  background:
    linear-gradient(
      135deg,
      #fff,
      #fff6f8
    );

}

.search-grid {

  display:grid;

  grid-template-columns:
    2fr 1fr 1fr auto;

  gap:10px;

  align-items:end;

}

.btn-search {

  height:42px;

  background:#8f1d3e;

  color:white;

}

.search-results {

  margin-top:15px;

  display:none;

}

.result-item {

  width:100%;

  border:

  background:white;

  border-radius:10px;

  padding:12px;

  margin-top:8px;

  cursor:pointer;

  text-align:left;

  transition:.2s;

}

.result-item:hover {

  border-color:#b8325a;

  background:#fff5f8;

}

.result-name {

  color:#7f1734;

}

.result-info {

  color:#64748b;

  margin-top:3px;

}

/************************************************
 * FRAIS
 ************************************************/

.frais-grid {

  gap:12px;

}

.money-input {

}

.money-input input {

}

.money-input span {

/************************************************

 ************************************************/

.ecolage-header {

  align-items:center;

  margin-bottom:12px;

}

.toggle-container {

  display:flex;

  align-items:center;

  gap:10px;

}

.switch {

  width:48px;

  height:25px;

}

.switch input {

  display:none;

}

.slider {

  position:absolute;

  inset:0;

  cursor:pointer;

  background:#cbd5e1;

  border-radius:30px;

  transition:.25s;

}

.slider:before {

  content:"";

  position:absolute;

  width:19px;

  height:19px;

  left:3px;

  top:3px;

  background:white;

  border-radius:50%;

  transition:.25s;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.15);

}

.switch input:checked + .slider {

  background:#7f1734;

}

.switch input:checked + .slider:before {

  transform:
    translateX(23px);

}

.toggle-text {

  font-weight:700;

  font-size:13px;

  color:#64748b;

}

.toggle-text.active {

  color:#7f1734;

}

.ecolage-fields {

  display:none;

  grid-template-columns:
    1fr 1fr;

  gap:13px;

}

.ecolage-fields.visible {

  display:grid;

}

/************************************************
 * TOTAL

.total-box {

.btn-submit {

  }

  .search-grid,
  .ecolage-fields {

    grid-template-columns:1fr;

  }

}

</style>

<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const APPS_SCRIPT_URL =
  'TON_URL_APPS_SCRIPT_ICI';


const DB_NAME =
  'GestionPaiementDB';

const DB_VERSION = 3;

const STORE_PAIEMENTS =
  'paiements_en_attente';


/************************************************************
 * SERVICE WORKER
 ************************************************************/

if (
  'serviceWorker' in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register(
          './service-worker.js'
        )
        .catch(
          function(erreur) {

            console.warn(
              'Service Worker :',
              erreur
            );

          }
        );

    }
  );

}


/************************************************************
 * INDEXED DB
 ************************************************************/

function ouvrirDB() {

  return new Promise(
    function(resolve,reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_PAIEMENTS
            )
          ) {

            db.createObjectStore(
              STORE_PAIEMENTS,
              {
                keyPath:'id',
                autoIncrement:true
              }
            );

          }

        };


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SAUVEGARDE LOCALE
 ************************************************************/

async function sauvegarderLocal(
  data
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve,reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .add({

          data:data,

          dateCreation:
            new Date()
              .toISOString(),

          synchronise:false

        });


      transaction.oncomplete =
        resolve;


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * COMPTER LOCAL
 ************************************************************/

async function compterLocaux() {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve,reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readonly'
        );


      const request =
        transaction
          .objectStore(
            STORE_PAIEMENTS
          )
          .count();


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/************************************************************
 * SYNCHRONISATION
 ************************************************************/

let synchronisationEnCours =
  false;


async function synchroniser() {

  if (
    synchronisationEnCours
  ) {

    return;

  }


  const nombre =
    await compterLocaux();


  if (
    nombre === 0
  ) {

    mettreAJourStatut(
      0
    );

    afficherMessage(
      'Aucune donnée locale à synchroniser.',
      'success'
    );

    return;

  }


  if (
    !navigator.onLine
  ) {

    afficherMessage(
      'Aucune connexion Internet. Les données restent sur cet appareil.',
      'error'
    );

    return;

  }


  synchronisationEnCours =
    true;


  const bouton =
    document.getElementById(
      'btnSync'
    );


  bouton.disabled =
    true;


  bouton.textContent =
    '⏳ Synchronisation...';


  try {

    const db =
      await ouvrirDB();


    const paiements =
      await new Promise(
        function(resolve,reject) {

          const transaction =
            db.transaction(
              STORE_PAIEMENTS,
              'readonly'
            );


          const request =
            transaction
              .objectStore(
                STORE_PAIEMENTS
              )
              .getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );


    for (
      const element
      of paiements
    ) {

      const resultat =
        await envoyerAuServeur(
          element.data
        );


      if (
        resultat.success
      ) {

        await supprimerLocal(
          element.id
        );

      }

    }


    const restant =
      await compterLocaux();


    mettreAJourStatut(
      restant
    );


    afficherMessage(

      restant === 0

        ? 'Synchronisation terminée avec succès.'

        : (
          restant +
          ' paiement(s) restent en attente.'
        ),

      restant === 0
        ? 'success'
        : 'error'

    );


  } catch(erreur) {

    afficherMessage(

      'La synchronisation a été interrompue : ' +
      (
        erreur.message ||
        erreur
      ),

      'error'

    );


    const restant =
      await compterLocaux();


    mettreAJourStatut(
      restant
    );


  } finally {

    synchronisationEnCours =
      false;


    bouton.disabled =
      false;


    bouton.textContent =
      '🔄 Synchroniser';

  }

}


/************************************************************
 * ENVOI SERVEUR
 ************************************************************/

async function envoyerAuServeur(
  data
) {

  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {

        method:'POST',

        headers:{

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify({

            action:
              'synchroniserPaiement',

            data:data

          })

      }
    );


  const resultat =
    await response.json();


  if (
    !resultat.success
  ) {

    throw new Error(
      resultat.message ||
      'Erreur serveur.'
    );

  }


  return resultat;

}


/************************************************************
 * SUPPRESSION LOCALE
 ************************************************************/

async function supprimerLocal(
  id
) {

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve,reject) {

      const transaction =
        db.transaction(
          STORE_PAIEMENTS,
          'readwrite'
        );


      transaction
        .objectStore(
          STORE_PAIEMENTS
        )
        .delete(id);


      transaction.oncomplete =
        resolve;


      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/************************************************************
 * STATUT
 ************************************************************/

async function actualiserStatut() {

  try {

    const nombre =
      await compterLocaux();


    mettreAJourStatut(
      nombre
    );

  } catch(erreur) {

    console.error(erreur);

  }

}


function mettreAJourStatut(
  nombre
) {

  const dot =
    document.getElementById(
      'statusDot'
    );


  const texte =
    document.getElementById(
      'statusText'
    );


  if (
    nombre > 0
  ) {

    dot.classList.add(
      'pending'
    );


    texte.classList.add(
      'pending'
    );


    texte.textContent =
      nombre +
      ' donnée(s) en attente';

  } else {

    dot.classList.remove(
      'pending'
    );


    texte.classList.remove(
      'pending'
    );


    texte.textContent =
      'Synchronisé';

  }

}


/************************************************************
 * PROTECTION HTML
 ************************************************************/

function echapperHTML(valeur) {

  return String(valeur ?? '')

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/************************************************************
 * RECHERCHE ÉLÈVES
 ************************************************************/

async function rechercherEleves() {

  const nom =
    document
      .getElementById(
        'rechercheNom'
      )
      .value
      .trim();


  const classe =
    document
      .getElementById(
        'rechercheClasse'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'rechercheEtablissement'
      )
      .value;


  if (!nom) {

    afficherMessage(
      'Veuillez saisir un nom pour effectuer la recherche.',
      'error'
    );

    return;

  }


  if (
    !navigator.onLine
  ) {

    afficherMessage(
      'La recherche d’élève nécessite une connexion Internet.',
      'error'
    );

    return;

  }


  const bouton =
    document.getElementById(
      'btnRecherche'
    );


  bouton.disabled =
    true;


  bouton.textContent =
    '⏳ Recherche...';


  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {

          method:'POST',

          headers:{

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'rechercherEleves',

              nom:
                nom,

              classe:
                classe,

              etablissement:
                etablissement

            })

        }
      );


    const resultat =
      await response.json();


    if (
      !resultat.success
    ) {

      throw new Error(
        resultat.message
      );

    }


    afficherResultatsRecherche(
      resultat.eleves || []
    );


  } catch(erreur) {

    afficherMessage(
      'Recherche impossible : ' +
      (
        erreur.message ||
        erreur
      ),
      'error'
    );

  } finally {

    bouton.disabled =
      false;

    bouton.textContent =
      '🔎 Rechercher';

  }

}


/************************************************************
 * AFFICHAGE RÉSULTATS RECHERCHE
 ************************************************************/

function afficherResultatsRecherche(
  eleves
) {

  const zone =
    document.getElementById(
      'searchResults'
    );


  zone.innerHTML =
    '';


  zone.style.display =
    'block';


  if (
    !eleves ||
    eleves.length === 0
  ) {

    zone.innerHTML =
      '<div style="padding:12px;color:#64748b;">Aucun élève trouvé.</div>';

    return;

  }


  eleves.forEach(
    function(eleves) {

      const bouton =
        document.createElement(
          'button'
        );


      bouton.className =
        'result-item';


      bouton.type =
        'button';


      bouton.innerHTML =

        '<div class="result-name">' +

        echapperHTML(
          eleves.nom
        ) +

        '</div>' +

        '<div class="result-info">' +

        echapperHTML(
          eleves.classe
        ) +

        ' · ' +

        echapperHTML(
          eleves.etablissement
        ) +

        '</div>';


      bouton.onclick =
        function() {

          selectionnerEleve(
            eleves
          );

        };


      zone.appendChild(
        bouton
      );

    }
  );

}


/************************************************************
 * SÉLECTION ÉLÈVE
 ************************************************************/

function selectionnerEleve(
  eleve
) {

  document
    .getElementById(
      'matricule'
    )
    .value =
    eleve.matricule || '';


  document
    .getElementById(
      'nom'
    )
    .value =
    eleve.nom || '';


  document
    .getElementById(
      'classe'
    )
    .value =
    eleve.classe || '';


  document
    .getElementById(
      'etablissement'
    )
    .value =
    eleve.etablissement || '';


  document
    .getElementById(
      'searchResults'
    )
    .style.display =
    'none';


  afficherMessage(
    'Élève sélectionné. Vous pouvez maintenant enregistrer le paiement.',
    'success'
  );

}


/************************************************************
 * MATRICULE POUR NOUVEL ÉLÈVE
 ************************************************************/

function calculerMatriculeLocal() {

  const nom =
    document
      .getElementById(
        'nom'
      )
      .value
      .trim();


  const classe =
    document
      .getElementById(
        'classe'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  if (
    !nom ||
    !classe ||
    !etablissement
  ) {

    document
      .getElementById(
        'matricule'
      )
      .value =
      '';

    return;

  }


  const codes = {

    'PS':'PS',
    'MS':'MS',
    '12ème':'12',
    '11ème':'11',
    '10ème':'10',
    '9ème':'9',
    '8ème':'8',
    '7ème':'7',
    '6ème':'6',
    '5ème':'5',
    '4ème':'4',
    '3ème':'3',
    '2nde':'2',
    '1ère':'1',
    'Terminale':'Tle'

  };


  document
    .getElementById(
      'matricule'
    )
    .value =

      nom
        .replace(
          /\s+/g,
          ' '
        )
        .toUpperCase() +

      '-' +

      codes[classe] +

      '-' +

      etablissement
        .toUpperCase();

}


/************************************************************
 * ECOLAGE
 ************************************************************/

function gererEcolage() {

  const toggle =
    document.getElementById(
      'ecolageToggle'
    );


  const fields =
    document.getElementById(
      'ecolageFields'
    );


  const text =
    document.getElementById(
      'toggleText'
    );


  if (
    toggle.checked
  ) {

    fields.classList.add(
      'visible'
    );


    text.textContent =
      'Oui';


    text.classList.add(
      'active'
    );

  } else {

    fields.classList.remove(
      'visible'
    );


    text.textContent =
      'Non';


    text.classList.remove(
      'active'
    );

  }


  calculerTotal();

}


/************************************************************
 * TOTAL
 ************************************************************/

function valeur(id) {

  return Number(
    document
      .getElementById(
        id
      )
      .value
  ) || 0;

}


function calculerTotal() {

  let total = 0;


  [
    'droit',
    'fraisGeneraux',
    'fram',
    'teeShirt',
    'cravate',
    'short',
    'extra'

  ].forEach(
    function(id) {

      total +=
        valeur(id);

    }
  );


  if (
    document
      .getElementById(
        'ecolageToggle'
      )
      .checked
  ) {

    total +=

      valeur(
        'montantEcolage'
      )

      *

      valeur(
        'nombreMois'
      );

  }


  document
    .getElementById(
      'total'
    )
    .textContent =

      total.toLocaleString(
        'fr-FR'
      );

}


/************************************************************
 * ENREGISTRER
 ************************************************************/

async function enregistrer() {

  cacherMessage();


  const nom =
    document
      .getElementById(
        'nom'
      )
      .value
      .trim();


  const classe =
    document
      .getElementById(
        'classe'
      )
      .value;


  const etablissement =
    document
      .getElementById(
        'etablissement'
      )
      .value;


  const ecolage =
    document
      .getElementById(
        'ecolageToggle'
      )
      .checked;


  if (
    !nom ||
    !classe ||
    !etablissement
  ) {

    afficherMessage(
      'Veuillez remplir le nom, la classe et l’établissement.',
      'error'
    );

    return;

  }


  const total =
    valeur('droit') +
    valeur('fraisGeneraux') +
    valeur('fram') +
    valeur('teeShirt') +
    valeur('cravate') +
    valeur('short') +
    valeur('extra') +

    (

      ecolage

        ? valeur('montantEcolage') *
          valeur('nombreMois')

        : 0

    );


  if (
    total <= 0
  ) {

    afficherMessage(
      'Veuillez renseigner au moins un montant.',
      'error'
    );

    return;

  }


  if (
    ecolage
  ) {

    if (
      valeur('montantEcolage') <= 0 ||
      valeur('nombreMois') <= 0
    ) {

      afficherMessage(
        'Veuillez renseigner le montant mensuel et le nombre de mois d’écolage.',
        'error'
      );

      return;

    }

  }


  const data = {

    idPaiement:
      genererIdPaiement(),

    nom:
      nom,

    classe:
      classe,

    etablissement:
      etablissement,

    droit:
      valeur('droit'),

    fraisGeneraux:
      valeur('fraisGeneraux'),

    fram:
      valeur('fram'),

    teeShirt:
      valeur('teeShirt'),

    cravate:
      valeur('cravate'),

    short:
      valeur('short'),

    extra:
      valeur('extra'),

    ecolage:
      ecolage,

    montantEcolage:
      valeur('montantEcolage'),

    nombreMois:
      valeur('nombreMois')

  };


  const bouton =
    document.getElementById(
      'btnSubmit'
    );


  bouton.disabled =
    true;


  bouton.textContent =
    '⏳ Enregistrement...';


  /*
   * IMPORTANT :
   *
   * L'enregistrement normal
   * est LOCAL EN PREMIER.
   *
   * Aucun fetch ici.
   */

  try {

    await sauvegarderLocal(
      data
    );


    await actualiserStatut();


    afficherMessage(
      'Paiement enregistré sur cet appareil. Cliquez sur « Synchroniser » pour envoyer les données vers Google Sheets.',
      'success'
    );


    nettoyerFormulaire();


  } catch(erreur) {

    afficherMessage(
      'Impossible d’enregistrer localement : ' +
      (
        erreur.message ||
        erreur
      ),
      'error'
    );

  } finally {

    bouton.disabled =
      false;


    bouton.textContent =
      '✓ Enregistrer le paiement';

  }

}


/************************************************************
 * ID PAIEMENT
 ************************************************************/

function genererIdPaiement() {

  if (
    crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (

    Date.now() +

    '-' +

    Math.random()
      .toString(36)
      .substring(2,10)

  );

}


/************************************************************
 * NETTOYAGE
 ************************************************************/

function nettoyerFormulaire() {

  [

    'nom',
    'matricule',
    'droit',
    'fraisGeneraux',
    'fram',
    'teeShirt',
    'cravate',
    'short',
    'extra',
    'montantEcolage',
    'nombreMois'

  ].forEach(
    function(id) {

      document
        .getElementById(id)
        .value =
        '';

    }
  );


  document
    .getElementById(
      'classe'
    )
    .value =
    '';


  document
    .getElementById(
      'etablissement'
    )
    .value =
    '';


  document
    .getElementById(
      'ecolageToggle'
    )
    .checked =
    false;


  gererEcolage();

}


/************************************************************
 * MESSAGES
 ************************************************************/

function afficherMessage(
  texte,
  type
) {

  const message =
    document.getElementById(
      'message'
    );


  message.textContent =
    texte;


  message.className =
    'message ' +
    type;


  message.style.display =
    'block';

}


function cacherMessage() {

  const message =
    document.getElementById(
      'message'
    );


  message.style.display =
    'none';

}


/************************************************************
 * NAVIGATION
 ************************************************************/

function ouvrirPaiements() {

  window.location.href =
    './paiements.html';

}


function ouvrirClasse() {

  window.location.href =
    './classe.html';

}


/************************************************************
 * INITIALISATION
 ************************************************************/

document
  .querySelectorAll(
    'input[type="number"]'
  )
  .forEach(
    function(input) {

      input.addEventListener(
        'input',
        calculerTotal
      );

    }
  );


document
  .getElementById(
    'nom'
  )
  .addEventListener(
    'input',
    calculerMatriculeLocal
  );


document
  .getElementById(
    'classe'
  )
  .addEventListener(
    'change',
    calculerMatriculeLocal
  );


document
  .getElementById(
    'etablissement'
  )
  .addEventListener(
    'change',
    calculerMatriculeLocal
  );


window.addEventListener(
  'load',
  function() {

    actualiserStatut();

    gererEcolage();

    calculerTotal();

  }
);

</script>
